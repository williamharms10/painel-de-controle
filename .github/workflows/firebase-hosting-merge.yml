name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate version.json
        run: echo "{\"version\":\"$(date -u +%Y%m%d%H%M%S)\"}" > version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAINEL_DE_CONTROLE_WILLIAMPH }}
          channelId: live
          projectId: painel-de-controle-williamph