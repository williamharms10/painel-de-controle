<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Painel de Projetos</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<meta name="theme-color" content="#F2F4F6" />
<script>
(function(){
  var VKEY = "painelVersionSeen";
  function checkVersion(){
    fetch("/version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var seen = localStorage.getItem(VKEY);
        if (seen && data.version && seen !== data.version) {
          localStorage.setItem(VKEY, data.version);
          window.location.reload();
        } else if (data.version) {
          localStorage.setItem(VKEY, data.version);
        }
      })
      .catch(function(){});
  }
  checkVersion();
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) checkVersion();
  });
  setInterval(checkVersion, 3 * 60 * 1000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F5F5F7;
    --panel:#FFFFFF;
    --panel-2:#F2F2F7;
    --line:#D2D2D7;
    --line-strong:#C7C7CC;
    --ink:#1D1D1F;
    --ink-dim:#6E6E73;
    --ink-tertiary:#8E8E93;
    --accent:#007AFF;
    --accent-dim:rgba(0,122,255,0.10);
    --gold:#B57600;

    --st-ideia:#8E8E93;
    --st-andamento:#007AFF;
    --st-pausado:#FF3B30;
    --st-concluido:#34C759;

    --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-0.01em; font-family:var(--font-display);}
  a{color:var(--accent); text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:var(--accent-dim);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px; border:2px solid var(--bg);}

  /* ---------- login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.2rem;
  }
  #login-screen .box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:2.3rem 2.1rem; width:min(360px, 90vw);
    box-shadow:0 1px 2px rgba(20,30,40,0.04), 0 8px 24px rgba(20,30,40,0.05);
  }
  #login-screen h1{font-size:1.55rem; margin-bottom:0.3rem;}
  #login-screen p.sub{color:var(--ink-dim); font-size:0.88rem; margin:0 0 1.6rem;}
  #login-screen input{
    width:100%; padding:0.7rem 0.1rem; margin-bottom:1.1rem; background:transparent;
    border:none; border-bottom:1px solid var(--line-strong); color:var(--ink); font-size:0.95rem;
    font-family:var(--font-display); border-radius:0;
  }
  #login-screen input::placeholder{color:var(--ink-tertiary);}
  #login-screen input:focus{outline:none; border-bottom:1px solid var(--accent);}
  #login-screen button.primary{
    width:100%; padding:0.75rem; background:var(--accent); color:#fff; border:none; border-radius:6px;
    font-weight:600; font-size:0.95rem; cursor:pointer; margin-top:0.4rem; font-family:var(--font-display);
  }
  #login-screen button.primary:active{opacity:0.85;}
  #login-screen button.link{
    background:none; border:none; color:var(--accent); font-size:0.85rem; cursor:pointer; margin-top:1.1rem; font-weight:500;
  }
  #login-error{color:var(--st-pausado); font-size:0.82rem; min-height:1.2em; margin-top:0.2rem;}

  /* ---------- app shell ---------- */
  #app{display:none; min-height:100vh; grid-template-columns: 320px 1fr;}
  #app.active{display:grid;}

  header.topbar{
    grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
    padding:0.85rem 1.4rem; border-bottom:1px solid rgba(60,60,67,0.16);
    background:rgba(255,255,255,0.78); backdrop-filter:saturate(160%) blur(14px);
    position:sticky; top:0; z-index:5;
  }
  header.topbar h1{font-size:1.06rem; color:var(--ink); font-weight:600;}
  header.topbar .meta{color:var(--ink-tertiary); font-size:0.78rem; margin-top:2px;}
  header.topbar .actions{display:flex; align-items:center; gap:0.45rem;}
  .brand{display:flex; align-items:center; gap:0.75rem;}
  .brand-mark{display:grid; place-items:center; width:34px; height:34px; color:var(--accent); background:var(--accent-dim); border:1px solid rgba(0,122,255,0.35); border-radius:10px; font-size:1.05rem; flex-shrink:0;}
  .btn-top{
    background:none; border:1px solid transparent; color:var(--ink-dim); padding:0.52rem 0.7rem;
    cursor:pointer; font-size:0.82rem; font-weight:500; border-radius:8px;
    transition:background .15s, border-color .15s, color .15s;
  }
  .btn-top:hover{color:var(--ink); border-color:var(--line); background:var(--panel-2);}
  .btn-top:active{opacity:0.7;}
  .btn-top.accent-amber{color:#9A6700; background:#FFF8E7; border-color:#EFD393;}
  .btn-top.accent-amber:hover{color:#9A6700; background:#FFF3D6;}
  #sync-toast{
    position:fixed; bottom:1.2rem; right:1.2rem; background:var(--ink); border:1px solid var(--ink);
    color:#fff; padding:0.75rem 1.05rem; border-radius:8px; font-size:0.83rem; max-width:320px;
    box-shadow:0 8px 24px rgba(20,30,40,0.25); z-index:20; display:none;
  }

  /* ---------- assistant chat panel ---------- */
  #assistant-overlay{
    position:fixed; inset:0; background:rgba(20,30,40,0.35); z-index:29; display:none;
  }
  #assistant-panel{
    position:fixed; top:0; right:-420px; width:400px; max-width:92vw; height:100vh; background:var(--panel);
    border-left:1px solid var(--line);
    z-index:30; display:flex; flex-direction:column;
    transition:right 0.28s cubic-bezier(.2,.9,.3,1);
  }
  #assistant-panel.open{ right:0; }
  #assistant-overlay.open{ display:block; }
  .assistant-header{
    display:flex; justify-content:space-between; align-items:flex-start; padding:1.2rem 1.3rem 1rem;
    border-bottom:1px solid var(--line);
  }
  .assistant-header h3{font-size:1.05rem; color:var(--ink);}
  .assistant-sub{font-size:0.76rem; color:var(--ink-tertiary); margin-top:3px;}
  #assistant-close{background:var(--panel-2); border:none; color:var(--ink-dim); font-size:1.1rem; cursor:pointer; line-height:1; width:28px; height:28px; border-radius:50%;}
  #assistant-messages{flex:1; overflow-y:auto; padding:1rem 1.2rem; display:flex; flex-direction:column; gap:0.7rem;}
  .msg{max-width:86%; padding:0.6rem 0.85rem; border-radius:10px; font-size:0.89rem; line-height:1.45; white-space:pre-wrap;}
  .msg.user{align-self:flex-end; background:var(--accent-dim); color:var(--ink); border:1px solid rgba(14,124,107,0.22); border-bottom-right-radius:3px;}
  .msg.assistant{align-self:flex-start; background:var(--panel-2); color:var(--ink); border:1px solid var(--line); border-bottom-left-radius:3px;}
  .msg.pending{color:var(--ink-dim); font-style:italic; background:transparent; border:none;}
  .assistant-empty{color:var(--ink-dim); font-size:0.84rem; padding-top:1rem; line-height:1.55;}
  .assistant-input-row{display:flex; gap:0.5rem; padding:0.9rem 1.1rem; border-top:1px solid var(--line); align-items:flex-end;}
  .assistant-input-row textarea{
    flex:1; resize:none; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); padding:0.6rem 0.9rem; font-family:var(--font-display); font-size:0.89rem; max-height:100px;
  }
  .assistant-input-row textarea:focus{outline:none; border-color:var(--accent);}
  .assistant-input-row button{
    background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 1.1rem; height:38px; font-weight:600;
    cursor:pointer; font-size:0.84rem; font-family:var(--font-display);
  }
  .assistant-input-row button:disabled{opacity:0.35; cursor:default;}

  /* ---------- sidebar ---------- */
  aside{
    border-right:1px solid rgba(60,60,67,0.14); background:rgba(255,255,255,0.55); display:flex; flex-direction:column;
    height:calc(100vh - 65px); position:sticky; top:65px;
  }
  .sidebar-tools{padding:1rem 1rem 0.7rem;}
  .sidebar-tools input[type="search"]{
    width:100%; padding:0.7rem 0.85rem; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; color:var(--ink); font-size:0.87rem; font-family:var(--font-display);
  }
  .sidebar-tools input[type="search"]::placeholder{color:var(--ink-tertiary);}
  .sidebar-tools input[type="search"]:focus{outline:none; border-color:var(--accent);}
  .tools-row{display:flex; gap:0.5rem; margin-top:0.7rem;}
  .tools-row select{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; color:var(--ink);
    font-size:0.76rem; padding:0.4rem 0.5rem; font-family:var(--font-display); cursor:pointer;
  }
  .toggle-chip{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim); border-radius:8px;
    padding:0.4rem 0.7rem; font-size:0.76rem; cursor:pointer; white-space:nowrap; font-family:var(--font-display);
  }
  .toggle-chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .filters{
    display:flex; gap:0.35rem; margin:0.9rem 0.8rem 1rem; overflow-x:auto;
  }
  .filters button{
    background:transparent; border:1px solid transparent; color:var(--ink-tertiary); padding:0.38rem 0.56rem;
    font-size:0.7rem; font-weight:500; cursor:pointer; white-space:nowrap; border-radius:99px;
    transition:background .15s, color .15s, border-color .15s;
  }
  .filters button.active{color:var(--accent); background:var(--accent-dim); border-color:rgba(0,122,255,0.3);}
  .filters button:hover{color:var(--ink);}

  #project-list{overflow-y:auto; flex:1; padding:0 0.8rem 0.8rem;}
  .proj-item{
    display:flex; align-items:center; gap:0.7rem; padding:0.75rem; cursor:pointer;
    background:rgba(255,255,255,0.78); border:1px solid transparent; border-radius:10px; margin-bottom:0.42rem;
    box-shadow:0 2px 8px rgba(0,0,0,0.025);
    transition:background .15s, box-shadow .15s, border-color .15s;
  }
  .proj-item:hover{background:#fff; box-shadow:0 6px 16px rgba(0,0,0,0.06);}
  .proj-item.selected{background:var(--accent-dim); border-color:#8EC5FF;}
  .status-dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .proj-item .txt{flex:1; min-width:0;}
  .proj-item .txt .nome{font-size:0.92rem; font-weight:500; line-height:1.3; color:var(--ink);}
  .proj-item .txt .cliente{font-size:0.76rem; color:var(--ink-tertiary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .proj-item .meta-col{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex-shrink:0;}
  .proj-item .atualizado{font-size:0.66rem; color:var(--ink-tertiary);}
  .proj-item .chevron{color:var(--ink-tertiary); font-size:0.9rem;}
  .new-proj-btn{
    margin:0.7rem 0.8rem 1rem; padding:0.65rem; background:var(--panel); border:1px dashed var(--line-strong); color:var(--accent);
    border-radius:10px; cursor:pointer; font-size:0.86rem; font-weight:500; font-family:var(--font-display);
  }
  .new-proj-btn:hover{border-color:var(--accent); background:var(--accent-dim);}

  /* ---------- main / detail ---------- */
  main{padding:2rem clamp(1.25rem, 3vw, 3rem); max-width:1180px;}
  .empty-state{color:var(--ink-dim); max-width:620px; padding:2rem; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(28,28,30,0.06);}
  .empty-state h2{color:var(--ink); font-size:1.3rem; margin-bottom:0.5rem;}
  .empty-state p{font-size:0.9rem; line-height:1.55;}
  .empty-state button{
    margin-top:1.2rem; background:var(--accent); color:#fff; border:none; padding:0.7rem 1.2rem;
    border-radius:8px; font-weight:600; cursor:pointer; font-size:0.9rem; font-family:var(--font-display);
  }
  .empty-state button:active{opacity:0.85;}

  .stat-row{display:flex; gap:0.9rem; margin:1.6rem 0 2rem; flex-wrap:wrap; max-width:760px;}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:0.9rem 1.1rem; min-width:120px; box-shadow:0 4px 14px rgba(28,28,30,0.04);}
  .stat-card .num{font-size:1.5rem; font-weight:600; color:var(--ink);}
  .stat-card .lbl{font-size:0.76rem; color:var(--ink-dim); margin-top:2px;}
  .stale-list{max-width:760px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:1.1rem 1.3rem; box-shadow:0 4px 14px rgba(28,28,30,0.04);}
  .stale-list h3{font-size:0.85rem; color:var(--ink); margin-bottom:0.4rem; font-weight:600;}
  .stale-item{
    display:flex; justify-content:space-between; align-items:center; padding:0.7rem 0; border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .stale-item:last-child{border-bottom:none;}
  .stale-item:hover .stale-name{color:var(--accent);}
  .stale-name{font-size:0.88rem; color:var(--ink); font-weight:500;}
  .stale-days{font-size:0.76rem; color:var(--st-pausado);}

  .field-row{display:flex; gap:1.6rem; margin-bottom:1.3rem;}
  .field{flex:1; margin-bottom:1.3rem;}
  .field label{display:block; font-size:0.74rem; color:var(--ink-dim); margin-bottom:0.45rem; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line-strong); color:var(--ink);
    padding:0.5rem 0.05rem; font-size:0.93rem; font-family:var(--font-display); border-radius:0;
  }
  .field textarea{
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:0.7rem 0.85rem;
    resize:vertical; min-height:76px; line-height:1.5;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .field #f-stack{font-family:var(--font-mono); font-size:0.87rem;}
  .field.field-narrow{max-width:240px;}
  .nome-field input{font-size:1.5rem; font-weight:600; letter-spacing:-0.01em; padding:0.25rem 0; border-bottom:1px solid var(--line-strong);}
  .nome-field input:focus{border-bottom-color:var(--accent);}

  select{appearance:none; cursor:pointer; background-image:linear-gradient(45deg, transparent 50%, var(--ink-tertiary) 50%), linear-gradient(135deg, var(--ink-tertiary) 50%, transparent 50%); background-position: calc(100% - 14px) center, calc(100% - 9px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;}

  .top-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.2rem; max-width:760px;}
  .save-indicator{font-size:0.74rem; color:var(--ink-tertiary); min-width:80px; text-align:right; align-self:center;}
  .save-indicator.saved{color:var(--st-concluido);}
  .edit-project-btn, .delete-btn{min-height:36px; padding:0.48rem 0.78rem; border-radius:8px; font-size:0.8rem; font-weight:600; cursor:pointer; font-family:var(--font-display);}
  .edit-project-btn{color:var(--ink-dim); background:var(--panel-2); border:1px solid var(--line); cursor:not-allowed;}
  .delete-btn{color:#fff; background:var(--st-pausado); border:1px solid #E92E24; box-shadow:0 2px 5px rgba(255,59,48,0.18);}
  .delete-btn:hover{opacity:0.9;}

  .links-row{display:flex; gap:0.6rem; margin-top:-0.6rem; margin-bottom:1.4rem; flex-wrap:wrap;}
  .links-row a{
    font-size:0.82rem; color:var(--accent); font-weight:500; padding:0.43rem 0.56rem;
    background:var(--accent-dim); border:1px solid rgba(0,122,255,0.28); border-radius:7px;
  }
  .links-row a:hover{background:rgba(0,122,255,0.16);}
  .contact-link{margin-top:-0.7rem; margin-bottom:1.3rem;}
  .contact-link a{font-size:0.82rem; border-bottom:1px solid rgba(0,122,255,0.35); color:var(--accent); padding-bottom:1px; font-weight:500;}

  .detail-card{
    max-width:760px; background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:1.4rem 1.6rem; box-shadow:0 10px 30px rgba(28,28,30,0.06);
  }

  .preview-frame{border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); box-shadow:0 4px 14px rgba(28,28,30,0.05);}
  .preview-bar{display:flex; align-items:center; gap:6px; padding:0.55rem 0.7rem; border-bottom:1px solid var(--line); background:var(--panel-2);}
  .preview-bar .dot{width:7px; height:7px; border-radius:50%; background:var(--line-strong);}
  .preview-url{flex:1; font-size:0.7rem; color:var(--ink-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:0.4rem;}
  .preview-frame iframe{width:100%; height:440px; border:none; display:block; background:#fff;}
  .preview-empty{padding:2.6rem 1.3rem; text-align:center; color:var(--ink-tertiary); font-size:0.83rem; line-height:1.6;}
  .preview-label{font-size:0.74rem; color:var(--ink-dim); margin-bottom:0.5rem; font-weight:500; margin-top:0.3rem;}

  .section-heading{font-size:0.74rem; color:var(--ink-dim); font-weight:500; margin:0.4rem 0 0.9rem; padding-top:1.1rem; border-top:1px solid var(--line);}
  .field-pass{position:relative;}
  .field-pass input{padding-right:3.6rem;}
  .field-actions{position:absolute; right:0; bottom:0.55rem; display:flex; gap:0.6rem;}
  .field-actions button{background:none; border:none; color:var(--ink-tertiary); font-size:0.68rem; cursor:pointer; padding:0;}
  .field-actions button:hover{color:var(--accent);}
  .admin-note{font-size:0.74rem; color:var(--ink-tertiary); margin:-0.7rem 0 1.3rem;}

  .checklist-box{display:flex; flex-direction:column; gap:0.5rem; margin-bottom:0.7rem;}
  .check-item{display:flex; align-items:center; gap:0.6rem;}
  .check-item input[type="checkbox"]{width:16px; height:16px; accent-color:var(--accent); flex-shrink:0;}
  .check-item .check-text{flex:1; border:none; border-bottom:1px solid var(--line); background:transparent; padding:0.3rem 0.1rem; font-size:0.88rem; color:var(--ink); font-family:var(--font-display);}
  .check-item .check-text:focus{outline:none; border-bottom-color:var(--accent);}
  .check-item.done .check-text{color:var(--ink-tertiary); text-decoration:line-through;}
  .check-remove{background:none; border:none; color:var(--ink-tertiary); cursor:pointer; font-size:0.78rem; flex-shrink:0;}
  .check-remove:hover{color:var(--st-pausado);}
  .checklist-actions{display:flex; gap:1rem; margin-bottom:1.3rem;}
  .checklist-actions button{background:none; border:none; color:var(--accent); font-size:0.8rem; cursor:pointer; font-weight:500; padding:0;}
  .checklist-actions button:hover{opacity:0.75;}
  .prazo-atrasado{color:var(--st-pausado); font-weight:600;}

  @media (max-width: 820px){
    #app.active{display:block;}
    aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    main{padding:1.2rem 1rem;}
    #app.detail-open aside{display:none;}
    #app.detail-open main{display:block;}
    #app:not(.detail-open) main{display:none;}
    .back-btn{display:inline-block !important;}
    .field-row{flex-direction:column; gap:0;}
    .top-row, .detail-card{max-width:100%;}
    .detail-card{padding:1.1rem;}
  }
  .back-btn{display:none; background:none; border:none; color:var(--accent); font-size:0.88rem; cursor:pointer; margin-bottom:1.1rem; font-weight:500;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>Painel de Projetos</h1>
    <p class="sub">Seus projetos e clientes, num só lugar.</p>
    <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" />
    <div id="login-error"></div>
    <button class="primary" id="login-btn">Entrar</button>
    <button class="link" id="signup-toggle">Primeira vez? Criar acesso</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">◈</div>
      <div>

// ---------- helpers ----------
function tsMillis(ts){
  if (!ts) return 0;
  return ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime();
}
function daysSince(ts){
  if (!ts) return 0;
  return Math.floor((Date.now() - tsMillis(ts)) / 86400000);
}
function relTime(ts){
  if (!ts) return "agora mesmo";
  const d = daysSince(ts);
  if (d <= 0) return "hoje";
  if (d === 1) return "ontem";
  if (d < 30) return "há " + d + " dias";
  const months = Math.floor(d / 30);
  if (months < 12) return "há " + months + (months === 1 ? " mês" : " meses");
  const years = Math.floor(months / 12);
  return "há " + years + (years === 1 ? " ano" : " anos");
}
function prazoInfo(prazo){
  if (!prazo) return null;
  const d = new Date(prazo + "T00:00:00");
  if (isNaN(d.getTime())) return null;
  const diffDays = Math.ceil((d.getTime() - Date.now()) / 86400000);
  if (diffDays < 0) return { text: "atrasado " + Math.abs(diffDays) + "d", overdue: true };
  if (diffDays <= 3) return { text: diffDays === 0 ? "prazo hoje" : "prazo em " + diffDays + "d", overdue: false };
  return null;
}
function contactLink(contato){
  if (!contato) return "";
  const trimmed = contato.trim();
  const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (emailRe.test(trimmed)) {
    return `<a href="mailto:${escapeAttr(trimmed)}" target="_blank" rel="noopener">Enviar e-mail ↗</a>`;
  }
  const digits = trimmed.replace(/\D/g, "");
  if (digits.length >= 8) {
    return `<a href="https://wa.me/${digits}" target="_blank" rel="noopener">Abrir WhatsApp ↗</a>`;
  }
  return "";
}

function showToast(msg, ms = 5000) {

async function getGithubUsername() {
  const settingsRef = doc(db, "usuarios", currentUser.uid);
  const snap = await getDoc(settingsRef);
  let username = snap.exists() ? snap.data().githubUsername : null;
  if (!username) {
    username = prompt("Qual é o seu usuário no GitHub? (ex: williamharms10)");
    if (!username) return null;
    username = username.trim().replace(/^@/, "");
    await setDoc(settingsRef, { githubUsername: username }, { merge: true });
  }
  return username;
}

document.getElementById("sync-github-btn").addEventListener("click", async () => {
  const btn = document.getElementById("sync-github-btn");
  const username = await getGithubUsername();
  if (!username) return;

  btn.disabled = true;
  btn.textContent = "Sincronizando...";
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated`);
    if (!res.ok) throw new Error("Não foi possível acessar o GitHub para esse usuário.");
    const repos = (await res.json()).filter(r => !r.fork && r.name.toLowerCase() !== "painel-de-controle");

    let criados = 0, atualizados = 0;
    for (const repo of repos) {
      const byLink = projectsCache.find(p => p.linkRepo === repo.html_url);
      const byName = projectsCache.find(p => (p.nome || "").toLowerCase() === repo.name.toLowerCase() && !p.linkRepo);

      if (byLink) {
        continue;
      } else if (byName) {
        await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", byName.id), {
          linkRepo: repo.html_url,
          stack: byName.stack || repo.language || "",
          atualizadoEm: serverTimestamp()
        });
        atualizados++;
      } else {
        await addDoc(projectsCol(), {
          nome: repo.name,
          cliente: "",
          contato: "",
          stack: repo.language || "",
          linkRepo: repo.html_url,
          linkApp: "",
          adminUsuario: "",
          adminSenha: "",
          pagamento: "na",
          tipo: "",
          prioridade: "media",
          prazo: "",
          responsavel: "",
          checklist: [],
          notas: repo.description || "",
          proximosPassos: "",
          status: "ideia",
          criadoEm: serverTimestamp(),
          atualizadoEm: serverTimestamp()
        });
        criados++;
      }
    }
    showToast(`Sincronizado: ${criados} projeto(s) novo(s), ${atualizados} atualizado(s) com o link do repositório.`);
  } catch (e) {
    showToast("Erro ao sincronizar: " + e.message, 7000);
  } finally {
    btn.disabled = false;
    btn.textContent = "Sincronizar com GitHub";
  }
});

// ---------- data ----------
function projectsCol() {
  return collection(db, "usuarios", currentUser.uid, "projetos");
}

function listenProjects() {
  const q = query(projectsCol());
  unsubscribeList = onSnapshot(q, (snap) => {
    projectsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    projectsCache.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    renderList();
    if (selectedId) {
      const still = projectsCache.find(p => p.id === selectedId);
      if (!still) { selectedId = null; renderMain(); }
    } else {
      renderMain();
    }
    if (projectsCache.length === 0) renderMain();
  });
}

async function seedProjects() {
  for (const p of SEED_PROJECTS) {
    await addDoc(projectsCol(), {
      ...p,
      contato: "", linkRepo: "", adminUsuario: "", adminSenha: "", pagamento: "na",
      tipo: "", prioridade: "media", prazo: "", responsavel: "", checklist: [], proximosPassos: "",
      criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
    });
  }
}

async function createProject(nome) {
  const ref = await addDoc(projectsCol(), {
    nome: nome || "Novo projeto", cliente: "", contato: "", stack: "",
    linkRepo: "", linkApp: "", adminUsuario: "", adminSenha: "", pagamento: "na",
    tipo: "", prioridade: "media", prazo: "", responsavel: "", checklist: [],
    notas: "", proximosPassos: "",
    status: "ideia", criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
  });
  selectedId = ref.id;
  renderList();
  renderMain();
}

function scheduleSave(id, field, value) {
  const proj = projectsCache.find(p => p.id === id);
  if (proj) proj[field] = value;
  const indicator = document.getElementById("save-indicator");
  if (indicator) { indicator.textContent = "salvando..."; indicator.classList.remove("saved"); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", id), {
      [field]: value, atualizadoEm: serverTimestamp()
    });
    if (indicator) { indicator.textContent = "salvo"; indicator.classList.add("saved"); }
  }, 500);
}

async function removeProject(id) {
  if (!confirm("Excluir este projeto? Essa ação não pode ser desfeita.")) return;
  await deleteDoc(doc(db, "usuarios", currentUser.uid, "projetos", id));
  selectedId = null;
  renderMain();
}

function renderList() {
  const listEl = document.getElementById("project-list");
  let items = projectsCache.slice();
  if (activeFilter !== "todos") items = items.filter(p => p.status === activeFilter);
  if (paymentFilterActive) items = items.filter(p => p.pagamento === "pendente");
  if (searchTerm) {
    items = items.filter(p =>
      (p.nome || "").toLowerCase().includes(searchTerm) ||
      (p.cliente || "").toLowerCase().includes(searchTerm)
    );
  }
  if (sortMode === "recente") {
    items.sort((a, b) => tsMillis(b.atualizadoEm) - tsMillis(a.atualizadoEm));
  } else if (sortMode === "antigo") {
    items.sort((a, b) => tsMillis(a.atualizadoEm) - tsMillis(b.atualizadoEm));
  } else {
    items.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
  }
  if (items.length === 0) {
    listEl.innerHTML = `<div style="padding:1.2rem 0.2rem; color:var(--ink-tertiary); font-size:0.83rem;">Nenhum projeto encontrado.</div>`;
    return;
  }
  listEl.innerHTML = items.map(p => {
    const pz = prazoInfo(p.prazo);
    const metaText = pz ? pz.text : relTime(p.atualizadoEm);
    const metaClass = pz && pz.overdue ? "atualizado prazo-atrasado" : "atualizado";
    return `
    <div class="proj-item ${p.id === selectedId ? 'selected' : ''}" data-id="${p.id}">
      <div class="status-dot" style="background:${STATUS_COLORS[p.status] || STATUS_COLORS.ideia}"></div>
      <div class="txt">
        <div class="nome">${escapeHtml(p.nome || "Sem nome")}</div>
        <div class="cliente">${escapeHtml(p.cliente || "Sem cliente definido")}</div>
      </div>
      <div class="meta-col">
        <div class="${metaClass}">${metaText}</div>
        <div class="chevron">›</div>
      </div>
    </div>
  `;
  }).join("");
  listEl.querySelectorAll(".proj-item").forEach(el => {
    el.addEventListener("click", () => {
      selectedId = el.dataset.id;
      document.getElementById("app").classList.add("detail-open");
      renderList();
      renderMain();
    });
  });
}

// ---------- render: main ----------
function renderMain() {
  const main = document.getElementById("main-content");

  if (projectsCache.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>Nenhum projeto cadastrado ainda</h2>

        <button id="seed-btn">Carregar meus projetos</button>
      </div>`;
    document.getElementById("seed-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Carregando...";
      await seedProjects();
    });
    return;
  }

  const proj = projectsCache.find(p => p.id === selectedId);
  if (!proj) {
    const counts = { ideia: 0, andamento: 0, pausado: 0, concluido: 0 };
    projectsCache.forEach(p => { counts[p.status] = (counts[p.status] || 0) + 1; });
    const stale = projectsCache
      .filter(p => p.status === "andamento" || p.status === "pausado")
      .map(p => ({ ...p, _days: daysSince(p.atualizadoEm) }))
      .filter(p => p._days >= 14)
      .sort((a, b) => b._days - a._days)
      .slice(0, 5);

    main.innerHTML = `
      <div class="empty-state" style="max-width:640px;">
        <h2>Visão geral</h2>
        <p>Escolha um projeto na lista ao lado, ou veja o resumo abaixo.</p>
      </div>
      <div class="stat-row">
        <div class="stat-card"><div class="num">${counts.andamento || 0}</div><div class="lbl">Em andamento</div></div>
        <div class="stat-card"><div class="num">${counts.ideia || 0}</div><div class="lbl">Ideia</div></div>
        <div class="stat-card"><div class="num">${counts.pausado || 0}</div><div class="lbl">Pausado</div></div>
        <div class="stat-card"><div class="num">${counts.concluido || 0}</div><div class="lbl">Concluído</div></div>
      </div>
      ${stale.length > 0 ? `
      <div class="stale-list">
        <h3>Sem atualização há um tempo</h3>
        ${stale.map(p => `
          <div class="stale-item" data-id="${p.id}">
            <span class="stale-name">${escapeHtml(p.nome || "Sem nome")}</span>
            <span class="stale-days">há ${p._days} dias</span>
          </div>
        `).join("")}
      </div>` : ""}
    `;
    main.querySelectorAll(".stale-item").forEach(el => {
      el.addEventListener("click", () => {
        selectedId = el.dataset.id;
        document.getElementById("app").classList.add("detail-open");
        renderList();
        renderMain();
      });
    });
    return;
  }

  main.innerHTML = `
    <button class="back-btn" id="back-btn">&larr; Voltar à lista</button>
    <div class="top-row">
      <div class="field nome-field" style="flex:1; margin-bottom:0;">
        <input type="text" id="f-nome" value="${escapeAttr(proj.nome)}" placeholder="Nome do projeto" />
      </div>
      <div style="display:flex; align-items:center; gap:0.55rem; margin-left:1rem;">
        <span class="save-indicator" id="save-indicator"></span>
        <button class="edit-project-btn" id="edit-project-btn" type="button" disabled title="Em breve">Editar projeto</button>
        <button class="delete-btn" id="delete-btn" type="button">Excluir</button>
      </div>
    </div>

    <div class="detail-card">
        <div class="field-row">
          <div class="field">
            <label>Cliente</label>
            <input type="text" id="f-cliente" value="${escapeAttr(proj.cliente)}" placeholder="Nome do cliente" />
          </div>
          <div class="field">
            <label>Contato</label>
            <input type="text" id="f-contato" value="${escapeAttr(proj.contato)}" placeholder="Telefone, e-mail..." />
          </div>
        </div>
        ${contactLink(proj.contato) ? `<div class="contact-link">${contactLink(proj.contato)}</div>` : ""}

        <div class="field-row">
          <div class="field">
            <label>Tipo de projeto</label>
            <select id="f-tipo">
              <option value="" ${!proj.tipo ? "selected" : ""}>— Selecionar —</option>
              ${Object.entries(TIPO_LABELS).map(([k, v]) =>
                `<option value="${k}" ${proj.tipo === k ? "selected" : ""}>${v}</option>`
              ).join("")}
            </select>
          </div>
          <div class="field">
            <label>Prioridade</label>
            <select id="f-prioridade">
              <option value="baixa" ${proj.prioridade === "baixa" ? "selected" : ""}>Baixa</option>
              <option value="media" ${(proj.prioridade || "media") === "media" ? "selected" : ""}>Média</option>
              <option value="alta" ${proj.prioridade === "alta" ? "selected" : ""}>Alta</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Prazo</label>
            <input type="date" id="f-prazo" value="${escapeAttr(proj.prazo)}" />
          </div>
          <div class="field">
            <label>Responsável</label>
            <input type="text" id="f-responsavel" value="${escapeAttr(proj.responsavel)}" placeholder="Quem está tocando isso" />
          </div>
        </div>

        <div class="field">
          <label>Checklist</label>
          <div id="checklist-box" class="checklist-box">
            ${(proj.checklist || []).map((item, i) => `
              <div class="check-item ${item.feito ? "done" : ""}" data-idx="${i}">
                <input type="checkbox" class="check-toggle" ${item.feito ? "checked" : ""} />
                <input type="text" class="check-text" value="${escapeAttr(item.texto)}" placeholder="Etapa..." />
                <button type="button" class="check-remove">✕</button>
              </div>
            `).join("")}
          </div>
          <div class="checklist-actions">
            <button type="button" id="check-add-btn">+ Adicionar item</button>
            ${proj.tipo ? `<button type="button" id="check-template-btn">Carregar checklist de "${TIPO_LABELS[proj.tipo]}"</button>` : ""}
          </div>
        </div>

        <div class="field field-narrow">
          <label>Pagamento</label>
          <select id="f-pagamento">
            ${Object.entries(PAGAMENTO_LABELS).map(([k, v]) =>
              `<option value="${k}" ${(proj.pagamento || "na") === k ? "selected" : ""}>${v}</option>`
            ).join("")}
          </select>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Status</label>
            <select id="f-status">
              ${Object.entries(STATUS_LABELS).map(([k, v]) =>
                `<option value="${k}" ${proj.status === k ? "selected" : ""}>${v}</option>`
              ).join("")}
            </select>
          </div>
          <div class="field">
            <label>Stack / tecnologia</label>
            <input type="text" id="f-stack" value="${escapeAttr(proj.stack)}" placeholder="Ex: React + Vite + Firebase" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Link do repositório</label>
            <input type="text" id="f-linkRepo" value="${escapeAttr(proj.linkRepo)}" placeholder="https://github.com/..." />
          </div>
          <div class="field">
            <label>Link do app publicado</label>
            <input type="text" id="f-linkApp" value="${escapeAttr(proj.linkApp)}" placeholder="https://...web.app" />
          </div>
        </div>
        ${(proj.linkRepo || proj.linkApp) ? `
          <div class="links-row">
            ${proj.linkRepo ? `<a href="${escapeAttr(proj.linkRepo)}" target="_blank" rel="noopener">Repositório ↗</a>` : ""}
            ${proj.linkApp ? `<a href="${escapeAttr(proj.linkApp)}" target="_blank" rel="noopener">Abrir app ↗</a>` : ""}
          </div>` : ""}

        <div class="preview-label">Prévia do app</div>
        ${proj.linkApp ? `
          <div class="preview-frame" style="margin-bottom:1.4rem;">
            <div class="preview-bar">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span class="preview-url">${escapeHtml(proj.linkApp)}</span>
            </div>
            <iframe src="${escapeAttr(proj.linkApp)}" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          </div>` : `
          <div class="preview-frame" style="margin-bottom:1.4rem;">
            <div class="preview-empty">Adicione o link do app publicado acima para ver uma prévia dele aqui.</div>
          </div>`}

        <div class="section-heading">Acesso administrativo</div>
        <div class="field-row">
          <div class="field field-pass">
            <label>Usuário / e-mail de acesso</label>
            <input type="text" id="f-adminUsuario" value="${escapeAttr(proj.adminUsuario)}" placeholder="admin@exemplo.com" autocomplete="off" />
            <div class="field-actions"><button type="button" class="copy-btn" data-target="f-adminUsuario">copiar</button></div>
          </div>
          <div class="field field-pass">
            <label>Senha de acesso</label>
            <input type="password" id="f-adminSenha" value="${escapeAttr(proj.adminSenha)}" placeholder="••••••••" autocomplete="off" />
            <div class="field-actions">
              <button type="button" class="toggle-pass" data-target="f-adminSenha">mostrar</button>
              <button type="button" class="copy-btn" data-target="f-adminSenha">copiar</button>
            </div>
          </div>
        </div>
        <div class="admin-note">Salvo só na sua conta — mesmo nível de acesso dos demais dados do projeto.</div>

        <div class="field">
          <label>Próximos passos</label>
          <textarea id="f-proximosPassos" placeholder="Onde parei / o que falta fazer...">${escapeHtml(proj.proximosPassos)}</textarea>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label>Notas</label>
          <textarea id="f-notas" placeholder="Qualquer outra anotação sobre o projeto...">${escapeHtml(proj.notas)}</textarea>
        </div>
    </div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => {
    document.getElementById("app").classList.remove("detail-open");
  });
  document.getElementById("delete-btn").addEventListener("click", () => removeProject(proj.id));

  const fieldMap = {
    "f-nome": "nome", "f-cliente": "cliente", "f-contato": "contato",
    "f-stack": "stack", "f-linkRepo": "linkRepo", "f-linkApp": "linkApp",
    "f-adminUsuario": "adminUsuario", "f-adminSenha": "adminSenha",
    "f-prazo": "prazo", "f-responsavel": "responsavel",
    "f-proximosPassos": "proximosPassos", "f-notas": "notas"
  };
  Object.entries(fieldMap).forEach(([elId, field]) => {
    const el = document.getElementById(elId);
    el.addEventListener("input", () => {
      scheduleSave(proj.id, field, el.value);
      if (field === "nome" || field === "cliente") renderList();
      if (field === "linkApp") renderMain();
      if (field === "contato") renderMain();
      if (field === "prazo") renderList();
    });
  });
  document.getElementById("f-status").addEventListener("change", (e) => {
    scheduleSave(proj.id, "status", e.target.value);
    renderList();
  });
  document.getElementById("f-pagamento").addEventListener("change", (e) => {
    scheduleSave(proj.id, "pagamento", e.target.value);
    renderList();
  });
  document.getElementById("f-tipo").addEventListener("change", (e) => {
    const novoTipo = e.target.value;
    scheduleSave(proj.id, "tipo", novoTipo);
    if (novoTipo && (!proj.checklist || proj.checklist.length === 0)) {
      const template = (CHECKLISTS[novoTipo] || []).map(t => ({ texto: t, feito: false }));
      proj.checklist = template;
      scheduleSave(proj.id, "checklist", template);
    }
    renderMain();
  });
  document.getElementById("f-prioridade").addEventListener("change", (e) => {
    scheduleSave(proj.id, "prioridade", e.target.value);
  });

  function getChecklist(){ return (proj.checklist || []).slice(); }
  function saveChecklist(list){
    proj.checklist = list;
    scheduleSave(proj.id, "checklist", list);
  }
  main.querySelectorAll(".check-toggle").forEach((cb, i) => {
    cb.addEventListener("change", () => {
      const list = getChecklist();
      list[i].feito = cb.checked;
      saveChecklist(list);
      renderMain();
    });
  });
  main.querySelectorAll(".check-text").forEach((inp, i) => {
    inp.addEventListener("input", () => {
      const list = getChecklist();
      list[i].texto = inp.value;
      saveChecklist(list);
    });
  });
  main.querySelectorAll(".check-remove").forEach((btn, i) => {
    btn.addEventListener("click", () => {
      const list = getChecklist();
      list.splice(i, 1);
      saveChecklist(list);
      renderMain();
    });
  });
  const addBtn = document.getElementById("check-add-btn");
  if (addBtn) addBtn.addEventListener("click", () => {
    const list = getChecklist();
    list.push({ texto: "", feito: false });
    saveChecklist(list);
    renderMain();
    const inputs = document.querySelectorAll(".check-text");
    if (inputs.length) inputs[inputs.length - 1].focus();
  });
  const templateBtn = document.getElementById("check-template-btn");
  if (templateBtn) templateBtn.addEventListener("click", () => {
    const list = getChecklist();
    const existing = new Set(list.map(i => i.texto));
    (CHECKLISTS[proj.tipo] || []).forEach(t => {
      if (!existing.has(t)) list.push({ texto: t, feito: false });
    });
    saveChecklist(list);
    renderMain();
  });

  main.querySelectorAll(".toggle-pass").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "mostrar" : "ocultar";
    });
  });
  main.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const input = document.getElementById(btn.dataset.target);
      try {
        await navigator.clipboard.writeText(input.value);
        const original = btn.textContent;
        btn.textContent = "copiado";
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch (e) {
        alert("Não foi possível copiar automaticamente. Selecione e copie manualmente.");
      }
    });
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function escapeAttr(str) { return escapeHtml(str || ""); }

// ---------- keyboard shortcuts ----------
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select" || e.target.isContentEditable;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("search-input").focus();
    return;
  }
  if (!typing && e.key.toLowerCase() === "n") {
    e.preventDefault();
    createProject();
  }
});

// ---------- assistant chat ----------
let assistantHistory = [];

function openAssistant() {
  document.getElementById("assistant-panel").classList.add("open");
  document.getElementById("assistant-overlay").classList.add("open");
  if (assistantHistory.length === 0) renderAssistantEmpty();
  document.getElementById("assistant-input").focus();
}
function closeAssistant() {
  document.getElementById("assistant-panel").classList.remove("open");
  document.getElementById("assistant-overlay").classList.remove("open");
}
document.getElementById("assistant-btn").addEventListener("click", openAssistant);
document.getElementById("assistant-close").addEventListener("click", closeAssistant);
document.getElementById("assistant-overlay").addEventListener("click", closeAssistant);

function renderAssistantEmpty() {
  document.getElementById("assistant-messages").innerHTML =
    `<div class="assistant-empty">Pergunte coisas como "quais projetos estão parados?", "resuma o status do Miguel Cabeleireiro" ou "o que falta no painel de projetos?".</div>`;
}

function appendMsg(role, text, pending = false) {
  const box = document.getElementById("assistant-messages");
  if (box.querySelector(".assistant-empty")) box.innerHTML = "";
  const div = document.createElement("div");
  div.className = `msg ${role}${pending ? " pending" : ""}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function sendAssistantMessage() {
  const input = document.getElementById("assistant-input");
  const text = input.value.trim();
  if (!text) return;
  const sendBtn = document.getElementById("assistant-send");

  appendMsg("user", text);
  assistantHistory.push({ role: "user", text });
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  const pendingEl = appendMsg("assistant", "Pensando...", true);

  try {
    const projetosResumo = projectsCache.map(p => ({
      nome: p.nome, cliente: p.cliente, status: p.status, stack: p.stack,
      proximosPassos: p.proximosPassos, notas: p.notas
    }));
    const idToken = await currentUser.getIdToken();
    const res = await fetch(ASSISTANT_WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        message: text,
        history: assistantHistory.slice(0, -1),
        projetos: projetosResumo
      })
    });
    const data = await res.json();
    pendingEl.remove();
    if (!res.ok) throw new Error(data.error || "Erro ao consultar o assistente.");
    const reply = data.text;
    appendMsg("assistant", reply);
    assistantHistory.push({ role: "assistant", text: reply });
  } catch (e) {
    pendingEl.remove();
    appendMsg("assistant", "Não consegui responder agora (" + (e.message || "erro desconhecido") + "). Tenta de novo em instantes.");
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById("assistant-send").addEventListener("click", sendAssistantMessage);
document.getElementById("assistant-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendAssistantMessage();
  }
});
document.getElementById("assistant-input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + "px";
});
</script>
</body>
