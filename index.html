<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Painel de Projetos</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
<meta name="theme-color" content="#0E141B" />
<script>
(function(){
  var VKEY = "painelVersionSeen";
  function checkVersion(){
    fetch("/version.json?t=" + Date.now(), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var seen = localStorage.getItem(VKEY);
        if (seen && data.version && seen !== data.version) {
          localStorage.setItem(VKEY, data.version);
          window.location.reload();
        } else if (data.version) {
          localStorage.setItem(VKEY, data.version);
        }
      })
      .catch(function(){});
  }
  checkVersion();
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden) checkVersion();
  });
  setInterval(checkVersion, 3 * 60 * 1000);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* base palette — technical "drafting board" identity */
    --ink:#0E141B;            /* app background */
    --panel:#141C25;          /* card / row / panel surface */
    --panel-2:#1B2530;        /* input & hover fill */
    --line:#26333F;           /* hairline separators / grid rules */
    --line-strong:#33434F;
    --paper:#EDEFF1;          /* primary text */
    --paper-dim:#8B98A6;      /* secondary text */
    --paper-tertiary:#556372; /* placeholders */
    --cyan:#6FD6E0;           /* single interactive accent — links, focus, active state */
    --cyan-dim:rgba(111,214,224,0.14);
    --gold:#D9A441;           /* one deliberate secondary accent — GitHub sync only */

    /* status semantics — independent of UI accent */
    --st-ideia:#78838F;
    --st-andamento:#6FD6E0;
    --st-pausado:#E2645A;
    --st-concluido:#7ECB8B;

    --font-display:'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-display);
    -webkit-font-smoothing:antialiased;
    background-image:
      linear-gradient(to right, rgba(111,214,224,0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(111,214,224,0.055) 1px, transparent 1px),
      linear-gradient(to right, rgba(111,214,224,0.09) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(111,214,224,0.09) 1px, transparent 1px);
    background-size: 22px 22px, 22px 22px, 110px 110px, 110px 110px;
    background-position: -1px -1px;
  }
  h1,h2,h3{margin:0; font-weight:600; letter-spacing:-0.01em; font-family:var(--font-display);}
  a{color:var(--cyan); text-decoration:none;}
  button{font-family:inherit;}
  ::selection{background:var(--cyan-dim);}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:6px; border:2px solid var(--ink);}

  /* ---------- login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.2rem;
  }
  #login-screen .box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:2.3rem 2.1rem; width:min(360px, 90vw);
  }
  #login-screen h1{font-size:1.55rem; margin-bottom:0.3rem;}
  #login-screen p.sub{color:var(--paper-dim); font-size:0.88rem; margin:0 0 1.6rem;}
  #login-screen input{
    width:100%; padding:0.7rem 0.1rem; margin-bottom:1.1rem; background:transparent;
    border:none; border-bottom:1px solid var(--line-strong); color:var(--paper); font-size:0.95rem;
    font-family:var(--font-display); border-radius:0;
  }
  #login-screen input::placeholder{color:var(--paper-tertiary);}
  #login-screen input:focus{outline:none; border-bottom:1px solid var(--cyan);}
  #login-screen button.primary{
    width:100%; padding:0.75rem; background:var(--cyan); color:#0E141B; border:none; border-radius:6px;
    font-weight:600; font-size:0.95rem; cursor:pointer; margin-top:0.4rem; font-family:var(--font-display);
  }
  #login-screen button.primary:active{opacity:0.8;}
  #login-screen button.link{
    background:none; border:none; color:var(--cyan); font-size:0.85rem; cursor:pointer; margin-top:1.1rem; font-weight:500;
  }
  #login-error{color:var(--st-pausado); font-size:0.82rem; min-height:1.2em; margin-top:0.2rem;}

  /* ---------- app shell ---------- */
  #app{display:none; min-height:100vh; grid-template-columns: 320px 1fr;}
  #app.active{display:grid;}

  header.topbar{
    grid-column:1 / -1; display:flex; align-items:flex-end; justify-content:space-between;
    padding:1.15rem 1.6rem 0.95rem; border-bottom:1px solid var(--line);
    background:rgba(14,20,27,0.88); backdrop-filter:saturate(160%) blur(14px);
    position:sticky; top:0; z-index:5;
  }
  header.topbar h1{font-size:1.4rem; color:var(--paper); font-weight:600;}
  header.topbar .meta{color:var(--paper-tertiary); font-size:0.78rem; margin-top:3px; font-family:var(--font-mono);}
  header.topbar .actions{display:flex; align-items:center; gap:1.3rem;}
  .btn-top{
    background:none; border:none; color:var(--paper-dim); padding:0.3rem 0.1rem;
    cursor:pointer; font-size:0.86rem; font-weight:500; border-bottom:1px solid transparent;
    transition:color .15s, border-color .15s;
  }
  .btn-top:hover{color:var(--cyan); border-bottom-color:var(--cyan);}
  .btn-top:active{opacity:0.7;}
  .btn-top.accent-amber{color:var(--gold);}
  .btn-top.accent-amber:hover{color:var(--gold); border-bottom-color:var(--gold);}
  #sync-toast{
    position:fixed; bottom:1.2rem; right:1.2rem; background:var(--panel); border:1px solid var(--line);
    color:var(--paper); padding:0.75rem 1.05rem; border-radius:8px; font-size:0.83rem; max-width:320px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35); z-index:20; display:none;
  }

  /* ---------- assistant chat panel ---------- */
  #assistant-overlay{
    position:fixed; inset:0; background:rgba(4,6,9,0.55); z-index:29; display:none;
  }
  #assistant-panel{
    position:fixed; top:0; right:-420px; width:400px; max-width:92vw; height:100vh; background:var(--panel);
    border-left:1px solid var(--line);
    z-index:30; display:flex; flex-direction:column;
    transition:right 0.28s cubic-bezier(.2,.9,.3,1);
  }
  #assistant-panel.open{ right:0; }
  #assistant-overlay.open{ display:block; }
  .assistant-header{
    display:flex; justify-content:space-between; align-items:flex-start; padding:1.2rem 1.3rem 1rem;
    border-bottom:1px solid var(--line);
  }
  .assistant-header h3{font-size:1.05rem; color:var(--paper);}
  .assistant-sub{font-size:0.76rem; color:var(--paper-tertiary); margin-top:3px; font-family:var(--font-mono);}
  #assistant-close{background:var(--panel-2); border:none; color:var(--paper-dim); font-size:1.1rem; cursor:pointer; line-height:1; width:28px; height:28px; border-radius:50%;}
  #assistant-messages{flex:1; overflow-y:auto; padding:1rem 1.2rem; display:flex; flex-direction:column; gap:0.7rem;}
  .msg{max-width:86%; padding:0.6rem 0.85rem; border-radius:10px; font-size:0.89rem; line-height:1.45; white-space:pre-wrap;}
  .msg.user{align-self:flex-end; background:var(--cyan-dim); color:var(--paper); border:1px solid rgba(111,214,224,0.3); border-bottom-right-radius:3px;}
  .msg.assistant{align-self:flex-start; background:var(--panel-2); color:var(--paper); border-bottom-left-radius:3px;}
  .msg.pending{color:var(--paper-dim); font-style:italic; background:transparent; border:none;}
  .assistant-empty{color:var(--paper-dim); font-size:0.84rem; padding-top:1rem; line-height:1.55;}
  .assistant-input-row{display:flex; gap:0.5rem; padding:0.9rem 1.1rem; border-top:1px solid var(--line); align-items:flex-end;}
  .assistant-input-row textarea{
    flex:1; resize:none; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--paper); padding:0.6rem 0.9rem; font-family:var(--font-display); font-size:0.89rem; max-height:100px;
  }
  .assistant-input-row textarea:focus{outline:none; border-color:var(--cyan);}
  .assistant-input-row button{
    background:var(--cyan); color:#0E141B; border:none; border-radius:8px; padding:0 1.1rem; height:38px; font-weight:600;
    cursor:pointer; font-size:0.84rem; font-family:var(--font-display);
  }
  .assistant-input-row button:disabled{opacity:0.35; cursor:default;}

  /* ---------- sidebar ---------- */
  aside{
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    height:calc(100vh - 74px); position:sticky; top:74px;
  }
  .sidebar-tools{padding:0.9rem 1.1rem 0.7rem;}
  .sidebar-tools input[type="search"]{
    width:100%; padding:0.55rem 0.1rem; background:transparent; border:none; border-bottom:1px solid var(--line-strong);
    border-radius:0; color:var(--paper); font-size:0.89rem; font-family:var(--font-display);
  }
  .sidebar-tools input[type="search"]::placeholder{color:var(--paper-tertiary);}
  .sidebar-tools input[type="search"]:focus{outline:none; border-bottom-color:var(--cyan);}
  .filters{
    display:flex; gap:1.1rem; margin:0 1.1rem 0.9rem; border-bottom:1px solid var(--line);
    overflow-x:auto;
  }
  .filters button{
    background:transparent; border:none; color:var(--paper-tertiary); padding:0.5rem 0.05rem;
    font-size:0.78rem; font-weight:500; cursor:pointer; white-space:nowrap;
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s;
  }
  .filters button.active{color:var(--paper); border-bottom-color:var(--cyan);}
  .filters button:hover{color:var(--paper);}

  #project-list{overflow-y:auto; flex:1; padding:0 1.1rem;}
  .proj-item{
    display:flex; align-items:center; gap:0.7rem; padding:0.75rem 0.2rem; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .proj-item:hover{background:rgba(111,214,224,0.04);}
  .proj-item.selected{background:var(--cyan-dim); margin:0 -0.6rem; padding-left:0.8rem; padding-right:0.8rem; border-radius:6px; border-bottom-color:transparent;}
  .status-dot{width:8px; height:8px; border-radius:2px; flex-shrink:0;}
  .proj-item .txt{flex:1; min-width:0;}
  .proj-item .txt .nome{font-size:0.92rem; font-weight:500; line-height:1.3; color:var(--paper);}
  .proj-item .txt .cliente{font-size:0.76rem; color:var(--paper-tertiary); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-mono);}
  .proj-item .chevron{color:var(--paper-tertiary); font-size:0.9rem; flex-shrink:0;}
  .new-proj-btn{
    margin:0.9rem 1.1rem 1rem; padding:0.65rem; background:transparent; border:1px dashed var(--line-strong); color:var(--cyan);
    border-radius:8px; cursor:pointer; font-size:0.86rem; font-weight:500; font-family:var(--font-display);
  }
  .new-proj-btn:hover{border-color:var(--cyan); background:var(--cyan-dim);}

  /* ---------- main / detail ---------- */
  main{padding:2.4rem 2.8rem; max-width:1180px;}
  .empty-state{color:var(--paper-dim); padding-top:3rem; max-width:420px;}
  .empty-state h2{color:var(--paper); font-size:1.3rem; margin-bottom:0.5rem;}
  .empty-state p{font-size:0.9rem; line-height:1.55;}
  .empty-state button{
    margin-top:1.2rem; background:var(--cyan); color:#0E141B; border:none; padding:0.7rem 1.2rem;
    border-radius:6px; font-weight:600; cursor:pointer; font-size:0.9rem; font-family:var(--font-display);
  }
  .empty-state button:active{opacity:0.8;}

  .field-row{display:flex; gap:1.6rem; margin-bottom:1.3rem;}
  .field{flex:1; margin-bottom:1.3rem;}
  .field label{display:block; font-size:0.74rem; color:var(--paper-dim); margin-bottom:0.45rem; font-weight:500;}
  .field input, .field select, .field textarea{
    width:100%; background:transparent; border:none; border-bottom:1px solid var(--line-strong); color:var(--paper);
    padding:0.5rem 0.05rem; font-size:0.93rem; font-family:var(--font-display); border-radius:0;
  }
  .field textarea{
    background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:0.7rem 0.85rem;
    resize:vertical; min-height:76px; line-height:1.5;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--cyan);}
  .field #f-stack{font-family:var(--font-mono); font-size:0.87rem;}
  .nome-field input{font-size:1.65rem; font-weight:600; letter-spacing:-0.01em; padding:0.25rem 0; border-bottom:1px solid var(--line-strong);}
  .nome-field input:focus{border-bottom-color:var(--cyan);}

  select{appearance:none; cursor:pointer; background-image:linear-gradient(45deg, transparent 50%, var(--paper-tertiary) 50%), linear-gradient(135deg, var(--paper-tertiary) 50%, transparent 50%); background-position: calc(100% - 14px) center, calc(100% - 9px) center; background-size:5px 5px, 5px 5px; background-repeat:no-repeat;}

  .top-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.7rem; padding-bottom:1.2rem; border-bottom:1px solid var(--line);}
  .save-indicator{font-size:0.74rem; color:var(--paper-tertiary); min-width:80px; text-align:right; font-family:var(--font-mono);}
  .save-indicator.saved{color:var(--st-concluido);}
  .delete-btn{background:none; border:none; color:var(--st-pausado); padding:0.4rem 0.5rem; cursor:pointer; font-size:0.83rem; font-weight:500;}
  .delete-btn:hover{opacity:0.75;}

  .links-row{display:flex; gap:1.2rem; margin-top:-0.6rem; margin-bottom:1.4rem;}
  .links-row a{
    font-size:0.82rem; font-family:var(--font-mono); border-bottom:1px solid rgba(111,214,224,0.35);
    color:var(--cyan); padding-bottom:1px; font-weight:500;
  }
  .links-row a:hover{border-bottom-color:var(--cyan);}

  .detail-layout{display:flex; gap:2.4rem; align-items:flex-start;}
  .detail-form{flex:1; min-width:0; max-width:640px;}
  .detail-preview{width:380px; flex-shrink:0; position:sticky; top:1.6rem;}

  .preview-frame{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--panel);}
  .preview-bar{display:flex; align-items:center; gap:6px; padding:0.55rem 0.7rem; border-bottom:1px solid var(--line); background:var(--panel-2);}
  .preview-bar .dot{width:7px; height:7px; border-radius:50%; background:var(--line-strong);}
  .preview-url{flex:1; font-family:var(--font-mono); font-size:0.7rem; color:var(--paper-tertiary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:0.4rem;}
  .preview-frame iframe{width:100%; height:480px; border:none; display:block; background:#fff;}
  .preview-empty{padding:2.6rem 1.3rem; text-align:center; color:var(--paper-tertiary); font-size:0.83rem; line-height:1.6;}
  .preview-label{font-size:0.74rem; color:var(--paper-dim); margin-bottom:0.5rem; font-weight:500;}

  .section-heading{font-size:0.74rem; color:var(--paper-dim); font-weight:500; margin:0.4rem 0 0.9rem; padding-top:1.1rem; border-top:1px solid var(--line);}
  .field-pass{position:relative;}
  .field-pass input{padding-right:3.6rem;}
  .field-actions{position:absolute; right:0; bottom:0.55rem; display:flex; gap:0.6rem;}
  .field-actions button{background:none; border:none; color:var(--paper-tertiary); font-size:0.68rem; font-family:var(--font-mono); cursor:pointer; padding:0;}
  .field-actions button:hover{color:var(--cyan);}
  .admin-note{font-size:0.74rem; color:var(--paper-tertiary); margin:-0.7rem 0 1.3rem; font-family:var(--font-mono);}

  @media (max-width: 1100px){
    .detail-layout{flex-direction:column;}
    .detail-form{max-width:none; width:100%;}
    .detail-preview{width:100%; position:static;}
  }

  @media (max-width: 820px){
    #app.active{display:block;}
    aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    main{padding:1.5rem;}
    #app.detail-open aside{display:none;}
    #app.detail-open main{display:block;}
    #app:not(.detail-open) main{display:none;}
    .back-btn{display:inline-block !important;}
    .field-row{flex-direction:column; gap:0;}
  }
  .back-btn{display:none; background:none; border:none; color:var(--cyan); font-size:0.88rem; cursor:pointer; margin-bottom:1.1rem; font-weight:500;}
  /* ===== PAINEL V2 — visual moderno; toda a lógica original permanece ===== */
  :root{--surface:#121b25;--shadow:0 18px 48px rgba(0,0,0,.22)}
  body{background-image:radial-gradient(circle at 80% -10%,rgba(111,214,224,.12),transparent 30%),linear-gradient(to right,rgba(111,214,224,.025) 1px,transparent 1px),linear-gradient(to bottom,rgba(111,214,224,.025) 1px,transparent 1px);background-size:auto,32px 32px,32px 32px}
  #app{grid-template-columns:300px minmax(0,1fr)}
  header.topbar{align-items:center;padding:.85rem 1.4rem;background:rgba(14,20,27,.86)}header.topbar h1{font-size:1.06rem}header.topbar .actions{gap:.45rem}.brand{display:flex;align-items:center;gap:.75rem}.brand-mark{display:grid;place-items:center;width:34px;height:34px;color:var(--cyan);background:var(--cyan-dim);border:1px solid rgba(111,214,224,.45);border-radius:10px;font-size:1.05rem}.btn-top{padding:.52rem .7rem;border:1px solid transparent;border-radius:8px}.btn-top:hover{border-color:var(--line);background:var(--panel-2)}.btn-top.accent-amber{background:rgba(217,164,65,.08);border-color:rgba(217,164,65,.32)}
  aside{background:rgba(14,20,27,.48)}.sidebar-tools{padding:1rem 1rem .8rem}.sidebar-tools input[type="search"]{padding:.7rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:9px}.filters{gap:.35rem;margin:0 .8rem 1rem;border:0}.filters button{padding:.38rem .56rem;margin:0;border:1px solid transparent;border-radius:99px;font-size:.7rem}.filters button.active{color:var(--cyan);background:var(--cyan-dim);border-color:rgba(111,214,224,.3)}#project-list{padding:0 .8rem .8rem}.proj-item{margin-bottom:.42rem;padding:.75rem;background:rgba(20,28,37,.46);border:1px solid transparent;border-radius:10px}.proj-item:hover{background:var(--panel-2);border-color:var(--line-strong)}.proj-item.selected{margin:0 0 .42rem;padding:.75rem;background:var(--cyan-dim);border-color:rgba(111,214,224,.36)}.new-proj-btn{margin:.7rem .8rem 1rem;background:var(--surface);border-style:solid}
  main{width:100%;max-width:1380px;padding:2rem clamp(1.25rem,3vw,3rem)}.empty-state,.project-hero,.detail-form,.detail-preview{border:1px solid var(--line);background:linear-gradient(145deg,rgba(27,37,48,.9),rgba(20,28,37,.74));border-radius:14px;box-shadow:var(--shadow)}.empty-state{max-width:620px;padding:2rem}.project-hero{padding:clamp(1rem,2vw,1.5rem);margin-bottom:1rem}.project-hero .eyebrow{margin-bottom:.45rem;color:var(--cyan);font:500 .68rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}.project-hero h2{font-size:clamp(1.35rem,2.4vw,2rem)}.project-hero p{margin:.32rem 0 0;color:var(--paper-dim);font-size:.9rem}.status-pill{display:inline-flex;align-items:center;gap:.42rem;margin-top:1rem;padding:.35rem .56rem;color:var(--paper);background:rgba(14,20,27,.42);border:1px solid var(--line-strong);border-radius:99px;font:.66rem var(--font-mono);letter-spacing:.06em;text-transform:uppercase}.status-pill i{display:block;width:7px;height:7px;border-radius:50%}.top-row{margin:0 0 1rem;padding:0;border:0}.detail-layout{gap:1rem;align-items:stretch}.detail-form{max-width:none;padding:1rem}.detail-preview{width:min(420px,38%);height:max-content;padding:1rem;position:sticky;top:5.4rem}.detail-layout>.detail-form>.field-row:first-child{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid var(--line)}.preview-label{font:500 .66rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase}.preview-frame{border-radius:10px}.preview-frame iframe{height:min(58vh,560px)}.links-row a{padding:.43rem .56rem;background:var(--cyan-dim);border:1px solid rgba(111,214,224,.28);border-radius:7px}
  @media(max-width:1100px){.detail-preview{width:100%;position:static}}@media(max-width:820px){header.topbar{padding:.7rem .9rem}.brand-mark{width:30px;height:30px}.btn-top{padding:.45rem .5rem;font-size:.75rem}main{padding:1.2rem 1rem}.detail-form,.detail-preview{padding:.8rem}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>Painel de Projetos</h1>
    <p class="sub">Seus projetos e clientes, num só lugar.</p>
    <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" />
    <div id="login-error"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, serverTimestamp, getDocs, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====== CONFIGURE AQUI COM AS CHAVES DO SEU PROJETO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyB5DlsHhgPZlAoox9zbIr8nmoo0AQBkgLw",
  authDomain: "painel-de-controle-williamph.firebaseapp.com",
  projectId: "painel-de-controle-williamph",
  storageBucket: "painel-de-controle-williamph.firebasestorage.app",
  messagingSenderId: "348228174091",
  appId: "1:348228174091:web:37abff9cebef1fda78620e"
};
// ===================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ====== COLOQUE AQUI A URL DO SEU CLOUDFLARE WORKER APÓS O DEPLOY ======
// Ex: "https://painel-projetos-assistente.SEU-SUBDOMINIO.workers.dev"
const ASSISTANT_WORKER_URL = "COLOQUE_AQUI";
// =========================================================================

const STATUS_LABELS = {
  ideia: "Ideia",
  andamento: "Em andamento",
  pausado: "Pausado",
  concluido: "Concluído"
};
const STATUS_COLORS = {
  ideia: "#78838F",
  andamento: "#6FD6E0",
  pausado: "#E2645A",
  concluido: "#7ECB8B"
};

const SEED_PROJECTS = [
  { nome: "Calendário de Presença", cliente: "Tripulação GOL (apto compartilhado)", stack: "HTML/JS + Firebase Realtime DB", linkApp: "https://qg-tripulacao.web.app/", status: "andamento", notas: "Calendário, tarefas e divisão de despesas do apartamento." },
  { nome: "FORJA (MTreino)", cliente: "Uso pessoal", stack: "HTML/JS + Firebase (Auth, Firestore, Hosting)", linkApp: "https://forja-app-17944.web.app", status: "andamento", notas: "PWA de treino, dieta, água e assistente de voz." },
  { nome: "Minuano F.C.", cliente: "Minuano F.C.", stack: "Firebase", linkApp: "https://minuanofc.web.app", status: "andamento", notas: "Gestão do clube — área pública + admin para membros." },
  { nome: "Mecânica Modelo", cliente: "Henzicar", stack: "Firebase", status: "andamento", notas: "Sistema de gestão da oficina mecânica." },
  { nome: "Resgate de Animais", cliente: "", stack: "", status: "ideia", notas: "App de denúncia comunitária + protótipo de coleira GPS/saúde." },
  { nome: "Miguel Cabeleireiro", cliente: "Salão de Beleza Miguel Cabeleireiro", stack: "React + Vite + Firebase", status: "ideia", notas: "Agenda de horários + controle de vendas, estoque e pagamentos pendentes. Público-alvo não é íntimo de tecnologia — interface extremamente simples." }
];

let currentUser = null;
let unsubscribeList = null;
let projectsCache = [];
let selectedId = null;
let activeFilter = "todos";
let searchTerm = "";
let saveTimer = null;

// ---------- auth ----------
const loginScreen = document.getElementById("login-screen");
const appEl = document.getElementById("app");
const loginError = document.getElementById("login-error");
let isSignupMode = false;

document.getElementById("signup-toggle").addEventListener("click", () => {
  isSignupMode = !isSignupMode;
  document.getElementById("signup-toggle").textContent = isSignupMode
    ? "Já tenho acesso — entrar"
    : "Primeira vez? Criar acesso";
  document.getElementById("login-btn").textContent = isSignupMode ? "Criar acesso" : "Entrar";
});

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  loginError.textContent = "";
  if (!email || !password) { loginError.textContent = "Preencha e-mail e senha."; return; }
  try {
    if (isSignupMode) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    loginError.textContent = traduzErro(e.code);
  }
});

function traduzErro(code) {
  const map = {
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-not-found": "Usuário não encontrado.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/email-already-in-use": "Esse e-mail já tem uma conta — tente entrar.",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres)."
  };
  return map[code] || "Não foi possível continuar. Tente de novo.";
}

document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

function showToast(msg, ms = 5000) {
  const t = document.getElementById("sync-toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = "none"; }, ms);
}

async function getGithubUsername() {
  const settingsRef = doc(db, "usuarios", currentUser.uid);
  const snap = await getDoc(settingsRef);
  let username = snap.exists() ? snap.data().githubUsername : null;
  if (!username) {
    username = prompt("Qual é o seu usuário no GitHub? (ex: williamharms10)");
    if (!username) return null;
    username = username.trim().replace(/^@/, "");
    await setDoc(settingsRef, { githubUsername: username }, { merge: true });
  }
  return username;
}

document.getElementById("sync-github-btn").addEventListener("click", async () => {
  const btn = document.getElementById("sync-github-btn");
  const username = await getGithubUsername();
  if (!username) return;

  btn.disabled = true;
  btn.textContent = "Sincronizando...";
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated`);
    if (!res.ok) throw new Error("Não foi possível acessar o GitHub para esse usuário.");
    const repos = (await res.json()).filter(r => !r.fork && r.name.toLowerCase() !== "painel-de-controle");

    let criados = 0, atualizados = 0;
    for (const repo of repos) {
      const byLink = projectsCache.find(p => p.linkRepo === repo.html_url);
      const byName = projectsCache.find(p => (p.nome || "").toLowerCase() === repo.name.toLowerCase() && !p.linkRepo);

      if (byLink) {
        continue; // já sincronizado antes, não sobrescreve edições manuais
      } else if (byName) {
        await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", byName.id), {
          linkRepo: repo.html_url,
          stack: byName.stack || repo.language || "",
          atualizadoEm: serverTimestamp()
        });
        atualizados++;
      } else {
        await addDoc(projectsCol(), {
          nome: repo.name,
          cliente: "",
          contato: "",
          stack: repo.language || "",
          linkRepo: repo.html_url,
          linkApp: "",
          notas: repo.description || "",
          proximosPassos: "",
          status: "ideia",
          criadoEm: serverTimestamp(),
          atualizadoEm: serverTimestamp()
        });
        criados++;
      }
    }
    showToast(`Sincronizado: ${criados} projeto(s) novo(s), ${atualizados} atualizado(s) com o link do repositório.`);
  } catch (e) {
    showToast("Erro ao sincronizar: " + e.message, 7000);
  } finally {
    btn.disabled = false;
    btn.textContent = "Sincronizar com GitHub";
  }
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    loginScreen.style.display = "none";
    appEl.classList.add("active");
    document.getElementById("user-email").textContent = user.email;
    listenProjects();
  } else {
    loginScreen.style.display = "flex";
    appEl.classList.remove("active");
    if (unsubscribeList) unsubscribeList();
  }
});

// ---------- data ----------
function projectsCol() {
  return collection(db, "usuarios", currentUser.uid, "projetos");
}

function listenProjects() {
  const q = query(projectsCol());
  unsubscribeList = onSnapshot(q, (snap) => {
    projectsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    projectsCache.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    renderList();
    if (selectedId) {
      const still = projectsCache.find(p => p.id === selectedId);
      if (!still) { selectedId = null; renderMain(); }
    }
    if (projectsCache.length === 0) renderMain();
  });
}

async function seedProjects() {
  for (const p of SEED_PROJECTS) {
    await addDoc(projectsCol(), {
      ...p,
      contato: "", linkRepo: "", proximosPassos: "",
      criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
    });
  }
}

async function createProject(nome) {
  const ref = await addDoc(projectsCol(), {
    nome: nome || "Novo projeto", cliente: "", contato: "", stack: "",
    linkRepo: "", linkApp: "", notas: "", proximosPassos: "",
    status: "ideia", criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
  });
  selectedId = ref.id;
  renderList();
  renderMain();
}

function scheduleSave(id, field, value) {
  const proj = projectsCache.find(p => p.id === id);
  if (proj) proj[field] = value;
  const indicator = document.getElementById("save-indicator");
  if (indicator) { indicator.textContent = "salvando..."; indicator.classList.remove("saved"); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", id), {
      [field]: value, atualizadoEm: serverTimestamp()
    });
    if (indicator) { indicator.textContent = "salvo"; indicator.classList.add("saved"); }
  }, 500);
}

async function removeProject(id) {
  if (!confirm("Excluir este projeto? Essa ação não pode ser desfeita.")) return;
  await deleteDoc(doc(db, "usuarios", currentUser.uid, "projetos", id));
  selectedId = null;
  renderMain();
}

// ---------- render: sidebar ----------
document.getElementById("search-input").addEventListener("input", (e) => {
  searchTerm = e.target.value.toLowerCase();
  renderList();
});
document.getElementById("filters").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  activeFilter = e.target.dataset.status;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  renderList();
});
document.getElementById("new-proj-btn").addEventListener("click", () => createProject());

function renderList() {
  const listEl = document.getElementById("project-list");
  let items = projectsCache;
  if (activeFilter !== "todos") items = items.filter(p => p.status === activeFilter);
  if (searchTerm) {
    items = items.filter(p =>
      (p.nome || "").toLowerCase().includes(searchTerm) ||
      (p.cliente || "").toLowerCase().includes(searchTerm)
    );
  }
  if (items.length === 0) {
    listEl.innerHTML = `<div style="padding:1.2rem 0.2rem; color:var(--paper-tertiary); font-size:0.83rem;">Nenhum projeto encontrado.</div>`;
    return;
  }
  listEl.innerHTML = items.map(p => `
    <div class="proj-item ${p.id === selectedId ? 'selected' : ''}" data-id="${p.id}">
      <div class="status-dot" style="background:${STATUS_COLORS[p.status] || STATUS_COLORS.ideia}"></div>
      <div class="txt">
        <div class="nome">${escapeHtml(p.nome || "Sem nome")}</div>
        <div class="cliente">${escapeHtml(p.cliente || "Sem cliente definido")}</div>
      </div>
      <div class="chevron">›</div>
    </div>
  `).join("");
  listEl.querySelectorAll(".proj-item").forEach(el => {
    el.addEventListener("click", () => {
      selectedId = el.dataset.id;
      document.getElementById("app").classList.add("detail-open");
      renderList();
      renderMain();
    });
  });
}

// ---------- render: main ----------
function renderMain() {
  const main = document.getElementById("main-content");

  if (projectsCache.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>Nenhum projeto cadastrado ainda</h2>
        <p>Comece carregando os projetos que já conhecemos das nossas conversas, e complete os detalhes (cliente, contato, links) depois.</p>
        <button id="seed-btn">Carregar meus projetos</button>
      </div>`;
    document.getElementById("seed-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Carregando...";
      await seedProjects();
    });
    return;
  }

  const proj = projectsCache.find(p => p.id === selectedId);
  if (!proj) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>Selecione um projeto</h2>
        <p>Escolha um projeto na lista ao lado, ou crie um novo.</p>
      </div>`;
    return;
  }

  main.innerHTML = `
    <button class="back-btn" id="back-btn">&larr; Voltar à lista</button>
    <div class="top-row">
      <div class="field nome-field" style="flex:1; margin-bottom:0;">
        <input type="text" id="f-nome" value="${escapeAttr(proj.nome)}" placeholder="Nome do projeto" />
      </div>
      <div style="display:flex; align-items:center; gap:0.9rem; margin-left:1rem;">
        <span class="save-indicator" id="save-indicator"></span>
        <button class="delete-btn" id="delete-btn">Excluir</button>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Cliente</label>
        <input type="text" id="f-cliente" value="${escapeAttr(proj.cliente)}" placeholder="Nome do cliente" />
      </div>
      <div class="field">
        <label>Contato</label>
        <input type="text" id="f-contato" value="${escapeAttr(proj.contato)}" placeholder="Telefone, e-mail..." />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          ${Object.entries(STATUS_LABELS).map(([k, v]) =>
            `<option value="${k}" ${proj.status === k ? "selected" : ""}>${v}</option>`
          ).join("")}
        </select>
      </div>
      <div class="field">
        <label>Stack / tecnologia</label>
        <input type="text" id="f-stack" value="${escapeAttr(proj.stack)}" placeholder="Ex: React + Vite + Firebase" />
      </div>
    </div>

    <div class="detail-layout">
      <div class="detail-form">
        <div class="field-row">
          <div class="field">
            <label>Link do repositório</label>
            <input type="text" id="f-linkRepo" value="${escapeAttr(proj.linkRepo)}" placeholder="https://github.com/..." />
          </div>
          <div class="field">
            <label>Link do app publicado</label>
            <input type="text" id="f-linkApp" value="${escapeAttr(proj.linkApp)}" placeholder="https://...web.app" />
          </div>
        </div>
        ${(proj.linkRepo || proj.linkApp) ? `
          <div class="links-row">
            ${proj.linkRepo ? `<a href="${escapeAttr(proj.linkRepo)}" target="_blank" rel="noopener">Repositório ↗</a>` : ""}
            ${proj.linkApp ? `<a href="${escapeAttr(proj.linkApp)}" target="_blank" rel="noopener">Abrir app ↗</a>` : ""}
          </div>` : ""}

        <div class="section-heading">Acesso administrativo</div>
        <div class="field-row">
          <div class="field field-pass">
            <label>Usuário / e-mail de acesso</label>
            <input type="text" id="f-adminUsuario" value="${escapeAttr(proj.adminUsuario)}" placeholder="admin@exemplo.com" autocomplete="off" />
            <div class="field-actions"><button type="button" class="copy-btn" data-target="f-adminUsuario">copiar</button></div>
          </div>
          <div class="field field-pass">
            <label>Senha de acesso</label>
            <input type="password" id="f-adminSenha" value="${escapeAttr(proj.adminSenha)}" placeholder="••••••••" autocomplete="off" />
            <div class="field-actions">
              <button type="button" class="toggle-pass" data-target="f-adminSenha">mostrar</button>
              <button type="button" class="copy-btn" data-target="f-adminSenha">copiar</button>
            </div>
          </div>
        </div>
        <div class="admin-note">Salvo só na sua conta — mesmo nível de acesso dos demais dados do projeto.</div>

        <div class="field">
          <label>Próximos passos</label>
          <textarea id="f-proximosPassos" placeholder="Onde parei / o que falta fazer...">${escapeHtml(proj.proximosPassos)}</textarea>
        </div>

        <div class="field">
          <label>Notas</label>
          <textarea id="f-notas" placeholder="Qualquer outra anotação sobre o projeto...">${escapeHtml(proj.notas)}</textarea>
        </div>
      </div>

      <div class="detail-preview">
        <div class="preview-label">Prévia do app</div>
        ${proj.linkApp ? `
          <div class="preview-frame">
            <div class="preview-bar">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span class="preview-url">${escapeHtml(proj.linkApp)}</span>
            </div>
            <iframe src="${escapeAttr(proj.linkApp)}" loading="lazy" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
          </div>` : `
          <div class="preview-frame">
            <div class="preview-empty">Adicione o link do app publicado acima para ver uma prévia dele aqui.</div>
          </div>`}
      </div>
    </div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => {
    document.getElementById("app").classList.remove("detail-open");
  });
  document.getElementById("delete-btn").addEventListener("click", () => removeProject(proj.id));

  const fieldMap = {
    "f-nome": "nome", "f-cliente": "cliente", "f-contato": "contato",
    "f-stack": "stack", "f-linkRepo": "linkRepo", "f-linkApp": "linkApp",
    "f-adminUsuario": "adminUsuario", "f-adminSenha": "adminSenha",
    "f-proximosPassos": "proximosPassos", "f-notas": "notas"
  };
  Object.entries(fieldMap).forEach(([elId, field]) => {
    const el = document.getElementById(elId);
    el.addEventListener("input", () => {
      scheduleSave(proj.id, field, el.value);
      if (field === "nome" || field === "cliente") renderList();
      if (field === "linkApp") renderMain();
    });
  });
  document.getElementById("f-status").addEventListener("change", (e) => {
    scheduleSave(proj.id, "status", e.target.value);
    renderList();
  });

  main.querySelectorAll(".toggle-pass").forEach(btn => {
    btn.addEventListener("click", () => {
      const input = document.getElementById(btn.dataset.target);
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      btn.textContent = showing ? "mostrar" : "ocultar";
    });
  });
  main.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const input = document.getElementById(btn.dataset.target);
      try {
        await navigator.clipboard.writeText(input.value);
        const original = btn.textContent;
        btn.textContent = "copiado";
        setTimeout(() => { btn.textContent = original; }, 1500);
      } catch (e) {
        alert("Não foi possível copiar automaticamente. Selecione e copie manualmente.");
      }
    });
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function escapeAttr(str) { return escapeHtml(str || ""); }

// ---------- assistant chat ----------
let assistantHistory = [];

function openAssistant() {
  document.getElementById("assistant-panel").classList.add("open");
  document.getElementById("assistant-overlay").classList.add("open");
  if (assistantHistory.length === 0) renderAssistantEmpty();
  document.getElementById("assistant-input").focus();
}
function closeAssistant() {
  document.getElementById("assistant-panel").classList.remove("open");
  document.getElementById("assistant-overlay").classList.remove("open");
}
document.getElementById("assistant-btn").addEventListener("click", openAssistant);
document.getElementById("assistant-close").addEventListener("click", closeAssistant);
document.getElementById("assistant-overlay").addEventListener("click", closeAssistant);

function renderAssistantEmpty() {
  document.getElementById("assistant-messages").innerHTML =
    `<div class="assistant-empty">Pergunte coisas como "quais projetos estão parados?", "resuma o status do Miguel Cabeleireiro" ou "o que falta no painel de projetos?".</div>`;
}

function appendMsg(role, text, pending = false) {
  const box = document.getElementById("assistant-messages");
  if (box.querySelector(".assistant-empty")) box.innerHTML = "";
  const div = document.createElement("div");
  div.className = `msg ${role}${pending ? " pending" : ""}`;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  return div;
}

async function sendAssistantMessage() {
  const input = document.getElementById("assistant-input");
  const text = input.value.trim();
  if (!text) return;
  const sendBtn = document.getElementById("assistant-send");

  appendMsg("user", text);
  assistantHistory.push({ role: "user", text });
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  const pendingEl = appendMsg("assistant", "Pensando...", true);

  try {
    const projetosResumo = projectsCache.map(p => ({
      nome: p.nome, cliente: p.cliente, status: p.status, stack: p.stack,
      proximosPassos: p.proximosPassos, notas: p.notas
    }));
    const idToken = await currentUser.getIdToken();
    const res = await fetch(ASSISTANT_WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${idToken}`
      },
      body: JSON.stringify({
        message: text,
        history: assistantHistory.slice(0, -1),
        projetos: projetosResumo
      })
    });
    const data = await res.json();
    pendingEl.remove();
    if (!res.ok) throw new Error(data.error || "Erro ao consultar o assistente.");
    const reply = data.text;
    appendMsg("assistant", reply);
    assistantHistory.push({ role: "assistant", text: reply });
  } catch (e) {
    pendingEl.remove();
    appendMsg("assistant", "Não consegui responder agora (" + (e.message || "erro desconhecido") + "). Tenta de novo em instantes.");
  } finally {
    sendBtn.disabled = false;
  }
}

document.getElementById("assistant-send").addEventListener("click", sendAssistantMessage);
document.getElementById("assistant-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendAssistantMessage();
  }
});
document.getElementById("assistant-input").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 100) + "px";
});
</script>
<script>
/* Camada visual: não substitui nem acessa Firebase, Firestore ou credenciais. */
(function(){
  const colors={ideia:"#78838F",andamento:"#6FD6E0",pausado:"#E2645A",concluido:"#7ECB8B"};
  const labels={ideia:"Ideia",andamento:"Em andamento",pausado:"Pausado",concluido:"Concluído"};
  function enhance(){
    const header=document.querySelector("header.topbar > div:first-child");
    if(header&&!header.classList.contains("brand")){
      header.classList.add("brand");
      const mark=document.createElement("div"); mark.className="brand-mark"; mark.textContent="◈"; mark.setAttribute("aria-hidden","true"); header.prepend(mark);
    }
    const main=document.getElementById("main-content");
    const name=document.getElementById("f-nome");
    const client=document.getElementById("f-cliente");
    const status=document.getElementById("f-status");
    if(!main||!name||!status||main.querySelector(".project-hero")) return;
    const row=main.querySelector(".top-row"); if(!row) return;
    const hero=document.createElement("section"); hero.className="project-hero";
    const eyebrow=document.createElement("div"); eyebrow.className="eyebrow"; eyebrow.textContent="Projeto selecionado";
    const title=document.createElement("h2"); title.textContent=name.value||"Sem nome";
    const subtitle=document.createElement("p"); subtitle.textContent=client&&client.value?client.value:"Cliente não definido";
    const pill=document.createElement("span"); pill.className="status-pill";
    const dot=document.createElement("i"); dot.style.background=colors[status.value]||colors.ideia;
    const text=document.createElement("span"); text.textContent=labels[status.value]||labels.ideia;
    pill.append(dot,text); hero.append(eyebrow,title,subtitle,pill); row.before(hero);
    name.addEventListener("input",()=>title.textContent=name.value||"Sem nome");
    if(client) client.addEventListener("input",()=>subtitle.textContent=client.value||"Cliente não definido");
    status.addEventListener("change",()=>{dot.style.background=colors[status.value]||colors.ideia;text.textContent=labels[status.value]||labels.ideia});
  }
  let queued=false;
  new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;enhance()})}).observe(document.body,{childList:true,subtree:true});
  enhance();
})();
</script>
