<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Painel de Projetos</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0E1A26" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0E1A26;
    --ink-800:#16283A;
    --ink-750:#1C3149;
    --line:#2E4256;
    --paper:#EDEAE0;
    --muted:#7C93A6;
    --amber:#E8A33D;
    --amber-dim:#5B4726;
    --green:#6FBF8B;
    --red:#D9756E;
    --blue:#6FA6D9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--ink-900);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:28px 28px;
    background-attachment:fixed;
    color:var(--paper);
    font-family:'Inter', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Source Serif 4', Georgia, serif; margin:0;}
  a{color:var(--blue);}
  button{font-family:inherit;}
  ::selection{background:var(--amber-dim);}

  /* ---------- login ---------- */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.2rem;
  }
  #login-screen .box{
    background:var(--ink-800); border:1px solid var(--line); border-radius:4px; padding:2rem 2.2rem; width:min(360px, 90vw);
  }
  #login-screen h1{font-size:1.5rem; margin-bottom:0.3rem;}
  #login-screen p.sub{color:var(--muted); font-size:0.9rem; margin:0 0 1.4rem;}
  #login-screen input{
    width:100%; padding:0.65rem 0.8rem; margin-bottom:0.7rem; background:var(--ink-900);
    border:1px solid var(--line); border-radius:3px; color:var(--paper); font-size:0.95rem;
  }
  #login-screen input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  #login-screen button.primary{
    width:100%; padding:0.7rem; background:var(--amber); color:var(--ink-900); border:none; border-radius:3px;
    font-weight:600; font-size:0.95rem; cursor:pointer; margin-top:0.4rem;
  }
  #login-screen button.link{
    background:none; border:none; color:var(--muted); font-size:0.85rem; cursor:pointer; margin-top:0.9rem; text-decoration:underline;
  }
  #login-error{color:var(--red); font-size:0.85rem; min-height:1.2em; margin-top:0.3rem;}

  /* ---------- app shell ---------- */
  #app{display:none; min-height:100vh; grid-template-columns: 340px 1fr;}
  #app.active{display:grid;}

  header.topbar{
    grid-column:1 / -1; display:flex; align-items:center; justify-content:space-between;
    padding:1rem 1.5rem; border-bottom:1px solid var(--line); background:rgba(14,26,38,0.85); backdrop-filter:blur(4px);
    position:sticky; top:0; z-index:5;
  }
  header.topbar h1{font-size:1.25rem; letter-spacing:0.2px;}
  header.topbar .meta{color:var(--muted); font-size:0.8rem; margin-top:2px;}
  header.topbar .actions{display:flex; align-items:center; gap:0.8rem;}
  header.topbar button.logout{background:none; border:1px solid var(--line); color:var(--muted); padding:0.4rem 0.8rem; border-radius:3px; cursor:pointer; font-size:0.8rem;}
  #sync-toast{
    position:fixed; bottom:1.2rem; right:1.2rem; background:var(--ink-800); border:1px solid var(--amber);
    color:var(--paper); padding:0.7rem 1rem; border-radius:4px; font-size:0.85rem; max-width:320px;
    box-shadow:0 4px 16px rgba(0,0,0,0.4); z-index:20; display:none;
  }

  /* ---------- sidebar ---------- */
  aside{
    border-right:1px solid var(--line); background:rgba(22,40,58,0.5); display:flex; flex-direction:column;
    height:calc(100vh - 62px); position:sticky; top:62px;
  }
  .sidebar-tools{padding:1rem 1rem 0.6rem;}
  .sidebar-tools input[type="search"]{
    width:100%; padding:0.55rem 0.7rem; background:var(--ink-900); border:1px solid var(--line);
    border-radius:3px; color:var(--paper); font-size:0.88rem;
  }
  .filters{display:flex; flex-wrap:wrap; gap:0.4rem; padding:0.8rem 1rem;}
  .filters button{
    background:transparent; border:1px solid var(--line); color:var(--muted); padding:0.3rem 0.65rem;
    border-radius:20px; font-size:0.76rem; cursor:pointer;
  }
  .filters button.active{border-color:var(--amber); color:var(--amber); background:rgba(232,163,61,0.08);}

  #project-list{overflow-y:auto; flex:1; padding:0 0.5rem 1rem;}
  .proj-item{
    display:flex; align-items:flex-start; gap:0.6rem; padding:0.7rem 0.7rem; border-radius:4px; cursor:pointer;
    margin-bottom:2px; border:1px solid transparent;
  }
  .proj-item:hover{background:rgba(255,255,255,0.03);}
  .proj-item.selected{background:var(--ink-750); border-color:var(--line);}
  .status-dot{width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0;}
  .proj-item .txt .nome{font-size:0.92rem; font-weight:600; line-height:1.3;}
  .proj-item .txt .cliente{font-size:0.78rem; color:var(--muted); margin-top:1px;}
  .new-proj-btn{
    margin:0.4rem 1rem 0.8rem; padding:0.6rem; background:none; border:1px dashed var(--line); color:var(--muted);
    border-radius:4px; cursor:pointer; font-size:0.85rem;
  }
  .new-proj-btn:hover{border-color:var(--amber); color:var(--amber);}

  /* ---------- main / detail ---------- */
  main{padding:2rem 2.4rem; max-width:760px;}
  .empty-state{color:var(--muted); padding-top:3rem; max-width:420px;}
  .empty-state h2{color:var(--paper); font-size:1.3rem; margin-bottom:0.5rem;}
  .empty-state button{
    margin-top:1.2rem; background:var(--amber); color:var(--ink-900); border:none; padding:0.6rem 1.1rem;
    border-radius:3px; font-weight:600; cursor:pointer; font-size:0.9rem;
  }

  .field-row{display:flex; gap:1rem; margin-bottom:1.1rem;}
  .field{flex:1; margin-bottom:1.1rem;}
  .field label{display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted); margin-bottom:0.35rem;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--ink-800); border:1px solid var(--line); border-radius:3px; color:var(--paper);
    padding:0.6rem 0.7rem; font-size:0.95rem; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:70px; line-height:1.4;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--amber);}
  .nome-field input{font-size:1.4rem; font-family:'Source Serif 4', serif; font-weight:600; background:transparent; border:none; padding:0.2rem 0; border-bottom:1px solid var(--line);}
  .nome-field input:focus{border-bottom-color:var(--amber);}

  .status-select-wrap{position:relative;}
  select{appearance:none; cursor:pointer;}

  .top-row{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:1.4rem;}
  .save-indicator{font-size:0.78rem; color:var(--muted); min-width:80px; text-align:right;}
  .save-indicator.saved{color:var(--green);}
  .delete-btn{background:none; border:1px solid var(--line); color:var(--red); padding:0.4rem 0.8rem; border-radius:3px; cursor:pointer; font-size:0.78rem;}
  .delete-btn:hover{border-color:var(--red);}

  .links-row{display:flex; gap:0.6rem; margin-top:0.2rem;}
  .links-row a{
    font-size:0.8rem; border:1px solid var(--line); padding:0.35rem 0.7rem; border-radius:3px; text-decoration:none;
    color:var(--blue); display:inline-flex; align-items:center; gap:0.3rem;
  }
  .links-row a:hover{border-color:var(--blue);}

  .seed-banner{
    background:var(--ink-800); border:1px solid var(--line); border-radius:4px; padding:1.1rem 1.3rem; margin-bottom:1.5rem;
  }
  .seed-banner p{margin:0 0 0.8rem; color:var(--muted); font-size:0.88rem; line-height:1.5;}
  .seed-banner button{background:var(--amber); color:var(--ink-900); border:none; padding:0.55rem 1rem; border-radius:3px; font-weight:600; cursor:pointer; font-size:0.85rem;}

  @media (max-width: 820px){
    #app.active{display:block;}
    aside{position:static; height:auto; border-right:none; border-bottom:1px solid var(--line);}
    main{padding:1.4rem;}
    #app.detail-open aside{display:none;}
    #app.detail-open main{display:block;}
    #app:not(.detail-open) main{display:none;}
    .back-btn{display:inline-block !important;}
  }
  .back-btn{display:none; background:none; border:none; color:var(--muted); font-size:0.85rem; cursor:pointer; margin-bottom:1rem;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="box">
    <h1>Painel de Projetos</h1>
    <p class="sub">Seus projetos e clientes, num só lugar.</p>
    <input type="email" id="login-email" placeholder="E-mail" autocomplete="username" />
    <input type="password" id="login-password" placeholder="Senha" autocomplete="current-password" />
    <div id="login-error"></div>
    <button class="primary" id="login-btn">Entrar</button>
    <button class="link" id="signup-toggle">Primeira vez? Criar acesso</button>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div>
      <h1>Painel de Projetos</h1>
      <div class="meta" id="user-email"></div>
    </div>
    <div class="actions">
      <button class="logout" id="sync-github-btn" style="border-color:var(--amber); color:var(--amber);">Sincronizar com GitHub</button>
      <button class="logout" id="logout-btn">Sair</button>
    </div>
  </header>

  <aside>
    <div class="sidebar-tools">
      <input type="search" id="search-input" placeholder="Buscar projeto ou cliente..." />
    </div>
    <div class="filters" id="filters">
      <button data-status="todos" class="active">Todos</button>
      <button data-status="ideia">Ideia</button>
      <button data-status="andamento">Em andamento</button>
      <button data-status="pausado">Pausado</button>
      <button data-status="concluido">Concluído</button>
    </div>
    <div id="project-list"></div>
    <button class="new-proj-btn" id="new-proj-btn">+ Novo projeto</button>
  </aside>

  <main id="main-content">
    <!-- populated by JS -->
  </main>
</div>
<div id="sync-toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, serverTimestamp, getDocs, setDoc, getDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====== CONFIGURE AQUI COM AS CHAVES DO SEU PROJETO FIREBASE ======
const firebaseConfig = {
  apiKey: "AIzaSyB5DlsHhgPZlAoox9zbIr8nmoo0AQBkgLw",
  authDomain: "painel-de-controle-williamph.firebaseapp.com",
  projectId: "painel-de-controle-williamph",
  storageBucket: "painel-de-controle-williamph.firebasestorage.app",
  messagingSenderId: "348228174091",
  appId: "1:348228174091:web:37abff9cebef1fda78620e"
};
// ===================================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const STATUS_LABELS = {
  ideia: "Ideia",
  andamento: "Em andamento",
  pausado: "Pausado",
  concluido: "Concluído"
};
const STATUS_COLORS = {
  ideia: "#7C93A6",
  andamento: "#E8A33D",
  pausado: "#D9756E",
  concluido: "#6FBF8B"
};

const SEED_PROJECTS = [
  { nome: "Calendário de Presença", cliente: "Tripulação GOL (apto compartilhado)", stack: "HTML/JS + Firebase Realtime DB", linkApp: "https://qg-tripulacao.web.app/", status: "andamento", notas: "Calendário, tarefas e divisão de despesas do apartamento." },
  { nome: "FORJA (MTreino)", cliente: "Uso pessoal", stack: "HTML/JS + Firebase (Auth, Firestore, Hosting)", linkApp: "https://forja-app-17944.web.app", status: "andamento", notas: "PWA de treino, dieta, água e assistente de voz." },
  { nome: "Minuano F.C.", cliente: "Minuano F.C.", stack: "Firebase", linkApp: "https://minuanofc.web.app", status: "andamento", notas: "Gestão do clube — área pública + admin para membros." },
  { nome: "Mecânica Modelo", cliente: "Henzicar", stack: "Firebase", status: "andamento", notas: "Sistema de gestão da oficina mecânica." },
  { nome: "Resgate de Animais", cliente: "", stack: "", status: "ideia", notas: "App de denúncia comunitária + protótipo de coleira GPS/saúde." },
  { nome: "Miguel Cabeleireiro", cliente: "Salão de Beleza Miguel Cabeleireiro", stack: "React + Vite + Firebase", status: "ideia", notas: "Agenda de horários + controle de vendas, estoque e pagamentos pendentes. Público-alvo não é íntimo de tecnologia — interface extremamente simples." }
];

let currentUser = null;
let unsubscribeList = null;
let projectsCache = [];
let selectedId = null;
let activeFilter = "todos";
let searchTerm = "";
let saveTimer = null;

// ---------- auth ----------
const loginScreen = document.getElementById("login-screen");
const appEl = document.getElementById("app");
const loginError = document.getElementById("login-error");
let isSignupMode = false;

document.getElementById("signup-toggle").addEventListener("click", () => {
  isSignupMode = !isSignupMode;
  document.getElementById("signup-toggle").textContent = isSignupMode
    ? "Já tenho acesso — entrar"
    : "Primeira vez? Criar acesso";
  document.getElementById("login-btn").textContent = isSignupMode ? "Criar acesso" : "Entrar";
});

document.getElementById("login-btn").addEventListener("click", async () => {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  loginError.textContent = "";
  if (!email || !password) { loginError.textContent = "Preencha e-mail e senha."; return; }
  try {
    if (isSignupMode) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    loginError.textContent = traduzErro(e.code);
  }
});

function traduzErro(code) {
  const map = {
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-not-found": "Usuário não encontrado.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/email-already-in-use": "Esse e-mail já tem uma conta — tente entrar.",
    "auth/weak-password": "Senha muito curta (mínimo 6 caracteres)."
  };
  return map[code] || "Não foi possível continuar. Tente de novo.";
}

document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

function showToast(msg, ms = 5000) {
  const t = document.getElementById("sync-toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = "none"; }, ms);
}

async function getGithubUsername() {
  const settingsRef = doc(db, "usuarios", currentUser.uid);
  const snap = await getDoc(settingsRef);
  let username = snap.exists() ? snap.data().githubUsername : null;
  if (!username) {
    username = prompt("Qual é o seu usuário no GitHub? (ex: williamharms10)");
    if (!username) return null;
    username = username.trim().replace(/^@/, "");
    await setDoc(settingsRef, { githubUsername: username }, { merge: true });
  }
  return username;
}

document.getElementById("sync-github-btn").addEventListener("click", async () => {
  const btn = document.getElementById("sync-github-btn");
  const username = await getGithubUsername();
  if (!username) return;

  btn.disabled = true;
  btn.textContent = "Sincronizando...";
  try {
    const res = await fetch(`https://api.github.com/users/${encodeURIComponent(username)}/repos?per_page=100&sort=updated`);
    if (!res.ok) throw new Error("Não foi possível acessar o GitHub para esse usuário.");
    const repos = (await res.json()).filter(r => !r.fork);

    let criados = 0, atualizados = 0;
    for (const repo of repos) {
      const byLink = projectsCache.find(p => p.linkRepo === repo.html_url);
      const byName = projectsCache.find(p => (p.nome || "").toLowerCase() === repo.name.toLowerCase() && !p.linkRepo);

      if (byLink) {
        continue; // já sincronizado antes, não sobrescreve edições manuais
      } else if (byName) {
        await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", byName.id), {
          linkRepo: repo.html_url,
          stack: byName.stack || repo.language || "",
          atualizadoEm: serverTimestamp()
        });
        atualizados++;
      } else {
        await addDoc(projectsCol(), {
          nome: repo.name,
          cliente: "",
          contato: "",
          stack: repo.language || "",
          linkRepo: repo.html_url,
          linkApp: "",
          notas: repo.description || "",
          proximosPassos: "",
          status: "ideia",
          criadoEm: serverTimestamp(),
          atualizadoEm: serverTimestamp()
        });
        criados++;
      }
    }
    showToast(`Sincronizado: ${criados} projeto(s) novo(s), ${atualizados} atualizado(s) com o link do repositório.`);
  } catch (e) {
    showToast("Erro ao sincronizar: " + e.message, 7000);
  } finally {
    btn.disabled = false;
    btn.textContent = "Sincronizar com GitHub";
  }
});

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    loginScreen.style.display = "none";
    appEl.classList.add("active");
    document.getElementById("user-email").textContent = user.email;
    listenProjects();
  } else {
    loginScreen.style.display = "flex";
    appEl.classList.remove("active");
    if (unsubscribeList) unsubscribeList();
  }
});

// ---------- data ----------
function projectsCol() {
  return collection(db, "usuarios", currentUser.uid, "projetos");
}

function listenProjects() {
  const q = query(projectsCol());
  unsubscribeList = onSnapshot(q, (snap) => {
    projectsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    projectsCache.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));
    renderList();
    if (selectedId) {
      const still = projectsCache.find(p => p.id === selectedId);
      if (!still) { selectedId = null; renderMain(); }
    }
    if (projectsCache.length === 0) renderMain();
  });
}

async function seedProjects() {
  for (const p of SEED_PROJECTS) {
    await addDoc(projectsCol(), {
      ...p,
      contato: "", linkRepo: "", proximosPassos: "",
      criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
    });
  }
}

async function createProject(nome) {
  const ref = await addDoc(projectsCol(), {
    nome: nome || "Novo projeto", cliente: "", contato: "", stack: "",
    linkRepo: "", linkApp: "", notas: "", proximosPassos: "",
    status: "ideia", criadoEm: serverTimestamp(), atualizadoEm: serverTimestamp()
  });
  selectedId = ref.id;
  renderList();
  renderMain();
}

function scheduleSave(id, field, value) {
  const proj = projectsCache.find(p => p.id === id);
  if (proj) proj[field] = value;
  const indicator = document.getElementById("save-indicator");
  if (indicator) { indicator.textContent = "salvando..."; indicator.classList.remove("saved"); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    await updateDoc(doc(db, "usuarios", currentUser.uid, "projetos", id), {
      [field]: value, atualizadoEm: serverTimestamp()
    });
    if (indicator) { indicator.textContent = "salvo"; indicator.classList.add("saved"); }
  }, 500);
}

async function removeProject(id) {
  if (!confirm("Excluir este projeto? Essa ação não pode ser desfeita.")) return;
  await deleteDoc(doc(db, "usuarios", currentUser.uid, "projetos", id));
  selectedId = null;
  renderMain();
}

// ---------- render: sidebar ----------
document.getElementById("search-input").addEventListener("input", (e) => {
  searchTerm = e.target.value.toLowerCase();
  renderList();
});
document.getElementById("filters").addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  activeFilter = e.target.dataset.status;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  renderList();
});
document.getElementById("new-proj-btn").addEventListener("click", () => createProject());

function renderList() {
  const listEl = document.getElementById("project-list");
  let items = projectsCache;
  if (activeFilter !== "todos") items = items.filter(p => p.status === activeFilter);
  if (searchTerm) {
    items = items.filter(p =>
      (p.nome || "").toLowerCase().includes(searchTerm) ||
      (p.cliente || "").toLowerCase().includes(searchTerm)
    );
  }
  if (items.length === 0) {
    listEl.innerHTML = `<div style="padding:1.2rem; color:var(--muted); font-size:0.85rem;">Nenhum projeto encontrado.</div>`;
    return;
  }
  listEl.innerHTML = items.map(p => `
    <div class="proj-item ${p.id === selectedId ? 'selected' : ''}" data-id="${p.id}">
      <div class="status-dot" style="background:${STATUS_COLORS[p.status] || STATUS_COLORS.ideia}"></div>
      <div class="txt">
        <div class="nome">${escapeHtml(p.nome || "Sem nome")}</div>
        <div class="cliente">${escapeHtml(p.cliente || "Sem cliente definido")}</div>
      </div>
    </div>
  `).join("");
  listEl.querySelectorAll(".proj-item").forEach(el => {
    el.addEventListener("click", () => {
      selectedId = el.dataset.id;
      document.getElementById("app").classList.add("detail-open");
      renderList();
      renderMain();
    });
  });
}

// ---------- render: main ----------
function renderMain() {
  const main = document.getElementById("main-content");

  if (projectsCache.length === 0) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>Nenhum projeto cadastrado ainda</h2>
        <p>Comece carregando os projetos que já conhecemos das nossas conversas, e complete os detalhes (cliente, contato, links) depois.</p>
        <button id="seed-btn">Carregar meus projetos</button>
      </div>`;
    document.getElementById("seed-btn").addEventListener("click", async (e) => {
      e.target.disabled = true;
      e.target.textContent = "Carregando...";
      await seedProjects();
    });
    return;
  }

  const proj = projectsCache.find(p => p.id === selectedId);
  if (!proj) {
    main.innerHTML = `
      <div class="empty-state">
        <h2>Selecione um projeto</h2>
        <p>Escolha um projeto na lista ao lado, ou crie um novo.</p>
      </div>`;
    return;
  }

  main.innerHTML = `
    <button class="back-btn" id="back-btn">&larr; Voltar à lista</button>
    <div class="top-row">
      <div class="field nome-field" style="flex:1; margin-bottom:0;">
        <input type="text" id="f-nome" value="${escapeAttr(proj.nome)}" placeholder="Nome do projeto" />
      </div>
      <div style="display:flex; align-items:center; gap:0.8rem; margin-left:1rem;">
        <span class="save-indicator" id="save-indicator"></span>
        <button class="delete-btn" id="delete-btn">Excluir</button>
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Cliente</label>
        <input type="text" id="f-cliente" value="${escapeAttr(proj.cliente)}" placeholder="Nome do cliente" />
      </div>
      <div class="field">
        <label>Contato</label>
        <input type="text" id="f-contato" value="${escapeAttr(proj.contato)}" placeholder="Telefone, e-mail..." />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Status</label>
        <select id="f-status">
          ${Object.entries(STATUS_LABELS).map(([k, v]) =>
            `<option value="${k}" ${proj.status === k ? "selected" : ""}>${v}</option>`
          ).join("")}
        </select>
      </div>
      <div class="field">
        <label>Stack / tecnologia</label>
        <input type="text" id="f-stack" value="${escapeAttr(proj.stack)}" placeholder="Ex: React + Vite + Firebase" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label>Link do repositório</label>
        <input type="text" id="f-linkRepo" value="${escapeAttr(proj.linkRepo)}" placeholder="https://github.com/..." />
      </div>
      <div class="field">
        <label>Link do app publicado</label>
        <input type="text" id="f-linkApp" value="${escapeAttr(proj.linkApp)}" placeholder="https://...web.app" />
      </div>
    </div>
    ${(proj.linkRepo || proj.linkApp) ? `
      <div class="links-row" style="margin:-0.6rem 0 1.2rem;">
        ${proj.linkRepo ? `<a href="${escapeAttr(proj.linkRepo)}" target="_blank" rel="noopener">Repositório ↗</a>` : ""}
        ${proj.linkApp ? `<a href="${escapeAttr(proj.linkApp)}" target="_blank" rel="noopener">Abrir app ↗</a>` : ""}
      </div>` : ""}

    <div class="field">
      <label>Próximos passos</label>
      <textarea id="f-proximosPassos" placeholder="Onde parei / o que falta fazer...">${escapeHtml(proj.proximosPassos)}</textarea>
    </div>

    <div class="field">
      <label>Notas</label>
      <textarea id="f-notas" placeholder="Qualquer outra anotação sobre o projeto...">${escapeHtml(proj.notas)}</textarea>
    </div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => {
    document.getElementById("app").classList.remove("detail-open");
  });
  document.getElementById("delete-btn").addEventListener("click", () => removeProject(proj.id));

  const fieldMap = {
    "f-nome": "nome", "f-cliente": "cliente", "f-contato": "contato",
    "f-stack": "stack", "f-linkRepo": "linkRepo", "f-linkApp": "linkApp",
    "f-proximosPassos": "proximosPassos", "f-notas": "notas"
  };
  Object.entries(fieldMap).forEach(([elId, field]) => {
    const el = document.getElementById(elId);
    el.addEventListener("input", () => {
      scheduleSave(proj.id, field, el.value);
      if (field === "nome" || field === "cliente") renderList();
    });
  });
  document.getElementById("f-status").addEventListener("change", (e) => {
    scheduleSave(proj.id, "status", e.target.value);
    renderList();
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function escapeAttr(str) { return escapeHtml(str || ""); }
</script>
</body>
</html>
